<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1120" viewBox="0 0 700 1120"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="63.5" font-size="37" fill="rgb(0,0,0)">现货与库存位置，各管一件事</text><text x="32" y="126.0" font-size="28" fill="rgb(0,0,0)">教学模拟 · 禾味 · 第 1 天日末下单前</text><text x="32" y="165.0" font-size="26" fill="rgb(0,0,0)">单位：公斤</text><rect x="32" y="180" width="636" height="165" fill="none" stroke="black" stroke-width="2"/><text x="56" y="232.0" font-size="33" fill="rgb(0,0,0)">今天能卖多少？看可用现货</text><text x="56" y="302.0" font-size="42" fill="rgb(0,0,0)">可用现货 = 5</text><text x="32" y="428.0" font-size="35" fill="rgb(0,0,0)">该补多少？还要看有效在途</text><rect x="32" y="465" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="520.0" font-size="34" fill="rgb(0,0,0)">库存位置 IP</text><text x="56" y="590.5" font-size="51" fill="rgb(0,0,0)">5 + 8 = 13</text><text x="56" y="662.5" font-size="30" fill="rgb(0,0,0)">现货 5 + 有效在途 8</text><rect x="32" y="750" width="636" height="178" fill="none" stroke="black" stroke-width="2"/><text x="56" y="805.0" font-size="34" fill="rgb(0,0,0)">目标 S = 20</text><text x="56" y="872.0" font-size="39" fill="rgb(0,0,0)">下单量 = 20 − 13 = 7</text><text x="32" y="1004.0" font-size="32" fill="rgb(0,0,0)">下单后 IP = 20，现货仍为 5。</text><text x="32" y="1070.5" font-size="32" fill="rgb(0,0,0)">在途不能当现货，也不能漏算。</text></g></svg>