<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1190" viewBox="0 0 700 1190"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="66.0" font-size="40" fill="rgb(0,0,0)">同一条路径，两种服务指标</text><text x="32" y="139.5" font-size="32" fill="rgb(0,0,0)">独立指标示意 · 数量单位：公斤</text><rect x="32" y="188" width="636" height="272" fill="none" stroke="black" stroke-width="2"/><text x="56" y="247.0" font-size="36" fill="rgb(0,0,0)">四个完整周期，各需求 20</text><text x="56" y="325.5" font-size="39" fill="rgb(0,0,0)">履约：20、20、20、19</text><text x="56" y="405.5" font-size="37" fill="rgb(0,0,0)">失销：  0、  0、  0、  1</text><text x="32" y="552.0" font-size="42" fill="rgb(0,0,0)">周期无缺货率</text><text x="32" y="628.0" font-size="48" fill="rgb(0,0,0)">3 ÷ 4 = 75%</text><text x="32" y="727.0" font-size="42" fill="rgb(0,0,0)">单位满足率</text><text x="32" y="800.0" font-size="43" fill="rgb(0,0,0)">79 ÷ 80 = 98.75%</text><polyline points="32,865 668,865" fill="none" stroke="black" stroke-width="3"/><text x="32" y="939.0" font-size="34" fill="rgb(0,0,0)">零需求周期：保留在周期分母</text><text x="32" y="1007.5" font-size="32" fill="rgb(0,0,0)">全窗口零需求：单位满足率 N/A</text><text x="32" y="1088.5" font-size="33" fill="rgb(0,0,0)">这是指标算例，不是服务承诺。</text></g></svg>