<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1480" viewBox="0 0 700 1480"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="66.0" font-size="40" fill="rgb(0,0,0)">先找保护期，再计算缓冲</text><text x="32" y="139.5" font-size="32" fill="rgb(0,0,0)">禾味公式算例 · 公斤 · 教学模拟</text><rect x="32" y="190" width="636" height="240" fill="none" stroke="black" stroke-width="2"/><text x="56" y="247.0" font-size="35" fill="rgb(0,0,0)">R = 2，L = 2，H = 4 天</text><text x="56" y="327.5" font-size="36" fill="rgb(0,0,0)">日均需求 6，日标准差 2</text><text x="56" y="402.0" font-size="39" fill="rgb(0,0,0)">σH = 2 × √4 = 4</text><text x="32" y="523.0" font-size="39" fill="rgb(0,0,0)">安全系数 z = 1.645</text><text x="32" y="594.0" font-size="40" fill="rgb(0,0,0)">SS = 1.645 × 4 = 6.58</text><text x="32" y="680.0" font-size="34" fill="rgb(0,0,0)">连续目标 S* = 6 × 4 + 6.58</text><text x="32" y="754.0" font-size="40" fill="rgb(0,0,0)">S* = 30.58，取整 S = 31</text><polyline points="32,815 668,815" fill="none" stroke="black" stroke-width="3"/><text x="32" y="889.5" font-size="34" fill="rgb(0,0,0)">固定 H、每日独立同分布时</text><text x="32" y="961.5" font-size="36" fill="rgb(0,0,0)">可用 σH = σ日 × √H。</text><text x="32" y="1059.0" font-size="36" fill="rgb(0,0,0)">把 z 对应到约 95%：</text><text x="32" y="1128.5" font-size="33" fill="rgb(0,0,0)">还要保护期需求近似正态，</text><text x="32" y="1197.5" font-size="32" fill="rgb(0,0,0)">均值估计可靠，事件时点相符。</text><text x="32" y="1307.0" font-size="36" fill="rgb(0,0,0)">失销回放仍须逐日核验。</text><text x="32" y="1388.5" font-size="33" fill="rgb(0,0,0)">不能承诺单位满足率为 95%。</text></g></svg>