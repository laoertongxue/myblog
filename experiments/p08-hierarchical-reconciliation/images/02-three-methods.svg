   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Noto Sans CJK JP'; text-anchor: start" x="30.24" y="41.76" transform="rotate(-0 30.24 41.76)">三条协调路径，不是一道唯一答案</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #4c4c4c" x="30.24" y="71.28" transform="rotate(-0 30.24 71.28)">均采用同一组模拟输入：总部100，北区60，南区50</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="138.24" y="131.898438" transform="rotate(-0 138.24 131.898438)">自下而上</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(84.24 220.538813)">保留地区预测</text>
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(110.698594 247.584938)">60 / 50</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="138.24" y="341.319063" transform="rotate(-0 138.24 341.319063)">总量110</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="360" y="131.898438" transform="rotate(-0 360 131.898438)">固定总部总量</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(306 207.01575)">按原比例拆分</text>
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(279.485156 234.061875)">54.545… / 45.454…</text>
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(305.458594 261.108)">整数：55 / 45</text>
   </g>
   <g id="text_8">
    <text style="font-size: 23px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="360" y="341.319063" transform="rotate(-0 360 341.319063)">总量100</text>
   </g>
   <g id="text_9">
    <text style="font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="581.76" y="131.898438" transform="rotate(-0 581.76 131.898438)">混合总量（权重0.6）</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(527.76 207.01575)">先混合再拆分</text>
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(501.245156 234.061875)">56.727… / 47.272…</text>
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'" transform="translate(527.218594 261.108)">整数：57 / 47</text>
   </g>
   <g id="text_11">
    <text style="font-size: 23px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="581.76" y="341.319063" transform="rotate(-0 581.76 341.319063)">总量104</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Noto Sans CJK JP'; text-anchor: start" x="30.24" y="396" transform="rotate(-0 30.24 396)">混合总量 = 0.6 × 100 + 0.4 × 110 = 104</text>
   </g>
   <g id="text_13">
