   <g id="text_4">
    <text style="font-size: 20px; font-family: 'Noto Sans CJK JP'" transform="translate(454.71 132.2175)">强制总部总量100</text>
    <text style="font-size: 20px; font-family: 'Noto Sans CJK JP'" transform="translate(445.706875 162.26875)">北55 / 南45 / 总100</text>
