   <g id="text_6">
    <text style="font-size: 19px; font-family: 'Noto Sans CJK JP'; text-anchor: middle" x="531.36" y="268.289219" transform="rotate(-0 531.36 268.289219)">底层 MAE = (5 + 5) ÷ 2 = 5</text>
