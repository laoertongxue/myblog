   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'Noto Sans CJK JP'; text-anchor: start" x="30.24" y="334.8" transform="rotate(-0 30.24 334.8)">两种方案都满足「地区之和 = 总量」。</text>
