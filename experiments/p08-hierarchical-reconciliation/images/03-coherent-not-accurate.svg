   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #4c4c4c" x="30.24" y="71.28" transform="rotate(-0 30.24 71.28)">反例：事后实际为北区60、南区50，共110件 · 教学模拟</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'Noto Sans CJK JP'" transform="translate(128.64 132.2175)">保留底层预测</text>
