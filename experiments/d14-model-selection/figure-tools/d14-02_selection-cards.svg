<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1530" viewBox="0 0 700 1530"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="30" y="64.0" font-size="40" fill="rgb(0,0,0)">先核对边界，再增加候选</text><text x="30" y="124.5" font-size="32" fill="rgb(0,0,0)">以下路线 D14 均未实现、未评分</text><rect x="25" y="170" width="650" height="280" fill="none" stroke="black" stroke-width="2"/><text x="45" y="225.0" font-size="40" fill="rgb(0,0,0)">01  SARIMA</text><text x="45" y="297.0" font-size="31" fill="rgb(0,0,0)">观察季节性与自相关。</text><text x="45" y="357.0" font-size="31" fill="rgb(0,0,0)">需要足够长、稳定的有序数据。</text><text x="45" y="417.0" font-size="31" fill="rgb(0,0,0)">先核对序列，再谈季节参数。</text><rect x="25" y="490" width="650" height="360" fill="none" stroke="black" stroke-width="2"/><text x="45" y="549.0" font-size="40" fill="rgb(0,0,0)">02  Croston 类</text><text x="45" y="617.0" font-size="31" fill="rgb(0,0,0)">先分清真实零与缺货零销量。</text><text x="45" y="677.0" font-size="31" fill="rgb(0,0,0)">建模非零需求量及发生间隔。</text><text x="45" y="737.0" font-size="31" fill="rgb(0,0,0)">不能修复缺货；经典 Croston 有偏。</text><text x="45" y="797.0" font-size="31" fill="rgb(0,0,0)">间歇需求也要与简单基线比较。</text><rect x="25" y="890" width="650" height="360" fill="none" stroke="black" stroke-width="2"/><text x="45" y="949.0" font-size="40" fill="rgb(0,0,0)">03  树模型</text><text x="45" y="1017.0" font-size="31" fill="rgb(0,0,0)">输入滞后、日历、活动特征。</text><text x="45" y="1077.0" font-size="31" fill="rgb(0,0,0)">每个特征必须在预测时已知。</text><text x="45" y="1137.0" font-size="31" fill="rgb(0,0,0)">按时间划分，不能随机切分。</text><text x="45" y="1197.0" font-size="31" fill="rgb(0,0,0)">防跨实体泄漏，核对特征来源。</text><text x="30" y="1352.5" font-size="38" fill="rgb(0,0,0)">候选路线 ≠ 已证明更优</text><text x="30" y="1417.5" font-size="32" fill="rgb(0,0,0)">图中没有新模型优劣数字。</text><text x="30" y="1477.5" font-size="32" fill="rgb(0,0,0)">D14 的任务：明确何时值得试。</text></g></svg>