<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1450" viewBox="0 0 700 1450"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="43" font-weight="600">怎样读库存与缺货取舍</text><rect x="32" y="125" width="636" height="235" fill="none" stroke="black" stroke-width="2"/><text x="56" y="188" font-size="42" font-weight="600">先看：是否少缺货</text><text x="56" y="261" font-size="37" font-weight="400">同一需求、相同初始状态</text><text x="56" y="321" font-size="37" font-weight="400">再比较失销量与满足率</text><path d="M350 380v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="440" width="636" height="235" fill="none" stroke="black" stroke-width="2"/><text x="56" y="503" font-size="42" font-weight="600">再看：付出什么代价</text><text x="56" y="576" font-size="38" font-weight="400">平均现存、订单次数</text><text x="56" y="636" font-size="38" font-weight="400">期末现存与未到尾单</text><path d="M350 695v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="755" width="636" height="235" fill="none" stroke="black" stroke-width="2"/><text x="56" y="818" font-size="42" font-weight="600">最后：限制是否说清</text><text x="56" y="891" font-size="35" font-weight="400">没有成本，就不称经济最优</text><text x="56" y="951" font-size="34" font-weight="400">没有效期，就不推断报废改善</text><path d="M32 1055H668" stroke="black" stroke-width="2"/><text x="32" y="1126" font-size="40" font-weight="400">禾味：数量用公斤</text><text x="32" y="1200" font-size="40" font-weight="400">匿名服装：数量用件</text><text x="32" y="1274" font-size="36" font-weight="400">两案分开比较，不相加评分。</text><text x="32" y="1396" font-size="35" font-weight="400">模拟结果不等于真实项目收益。</text></g></svg>
