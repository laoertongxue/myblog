<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1450" viewBox="0 0 700 1450"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="44" font-weight="600">冻结后，各评哪一段？</text><rect x="32" y="124" width="636" height="240" fill="none" stroke="black" stroke-width="2"/><text x="56" y="184" font-size="41" font-weight="600">预测：第 141—180 天</text><text x="56" y="252" font-size="39" font-weight="400">固定五日评价窗口</text><text x="56" y="316" font-size="39" font-weight="400">完整落在测试块内</text><path d="M350 384v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="444" width="636" height="310" fill="none" stroke="black" stroke-width="2"/><text x="56" y="507" font-size="41" font-weight="600">库存：第 153—180 天</text><text x="56" y="579" font-size="38" font-weight="400">两策略从相同现存起跑</text><text x="56" y="648" font-size="38" font-weight="400">初始在途均为空</text><text x="56" y="717" font-size="37" font-weight="400">不热身，不继承验证末态</text><path d="M32 819H668" stroke="black" stroke-width="2"/><text x="32" y="887" font-size="38" font-weight="600">测试前：参数与规则已冻结</text><text x="32" y="960" font-size="36" font-weight="400">测试后：报告结果，不重新选参</text><rect x="32" y="1034" width="636" height="285" fill="none" stroke="black" stroke-width="2"/><text x="56" y="1098" font-size="41" font-weight="600">不能称为全新盲测</text><text x="56" y="1172" font-size="38" font-weight="400">历史测试汇总已公开</text><text x="56" y="1240" font-size="37" font-weight="400">协议曾修订，须如实披露</text><text x="32" y="1398" font-size="34" font-weight="400">模拟需求 / 无效期的单节点回放</text></g></svg>
