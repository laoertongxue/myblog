<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1530" viewBox="0 0 700 1530"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="44" font-weight="600">四项指标，四种问题</text><rect x="32" y="125" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="186" font-size="42" font-weight="600">01  平均现存</text><text x="56" y="260" font-size="35" font-weight="400">日末现存之和 ÷ 测试天数</text><text x="56" y="327" font-size="34" font-weight="400">不含在途，不代表日内平均</text><rect x="32" y="415" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="476" font-size="42" font-weight="600">02  单位满足率</text><text x="56" y="550" font-size="35" font-weight="400">满足需求合计 ÷ 需求合计</text><text x="56" y="617" font-size="34" font-weight="400">总需求为零时记为不适用</text><rect x="32" y="705" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="766" font-size="42" font-weight="600">03  失销量</text><text x="56" y="840" font-size="35" font-weight="400">需求合计 − 满足需求合计</text><text x="56" y="907" font-size="34" font-weight="400">未满足就失销，不转为欠交</text><rect x="32" y="995" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="1056" font-size="42" font-weight="600">04  订单次数</text><text x="56" y="1130" font-size="35" font-weight="400">只数订货量大于零的事件</text><text x="56" y="1197" font-size="34" font-weight="400">到了复核日，也可能不下单</text><path d="M32 1298H668" stroke="black" stroke-width="2"/><text x="32" y="1375" font-size="41" font-weight="600">满足率 ≠ 周期服务水平</text><text x="32" y="1450" font-size="36" font-weight="400">比较指标，不混淆业务含义。</text></g></svg>
