<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1290" viewBox="0 0 700 1290"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="68.0" font-size="43" fill="rgb(0,0,0)">低于阈值，也只补一批</text><text x="32" y="133.0" font-size="32" fill="rgb(0,0,0)">教学模拟 · 单位：公斤</text><rect x="32" y="182" width="636" height="177" fill="none" stroke="black" stroke-width="2"/><text x="56" y="237.0" font-size="34" fill="rgb(0,0,0)">日末下单前</text><text x="56" y="304.5" font-size="38" fill="rgb(0,0,0)">IP = 3，r = 10，Q = 6</text><polyline points="350,379 350,419 340,409" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="444" width="636" height="168" fill="none" stroke="black" stroke-width="2"/><text x="56" y="501.0" font-size="37" fill="rgb(0,0,0)">3 ≤ 10：触发一次</text><text x="56" y="573.0" font-size="38" fill="rgb(0,0,0)">当天只下一单 6 公斤</text><polyline points="350,632 350,672 340,662" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="697" width="636" height="179" fill="none" stroke="black" stroke-width="2"/><text x="56" y="756.0" font-size="38" fill="rgb(0,0,0)">下单后 IP = 3 + 6 = 9</text><text x="56" y="828.0" font-size="33" fill="rgb(0,0,0)">9 ≤ 10，但本次复核已结束</text><text x="32" y="959.0" font-size="34" fill="rgb(0,0,0)">不能用 while 循环继续追单。</text><text x="32" y="1030.5" font-size="36" fill="rgb(0,0,0)">下一次检查：明天日末。</text><polyline points="32,1074 668,1074" fill="none" stroke="black" stroke-width="3"/><text x="32" y="1153.0" font-size="33" fill="rgb(0,0,0)">新订单进入在途，不进入现货。</text><text x="32" y="1222.5" font-size="32" fill="rgb(0,0,0)">下单 ≠ 到货，不能立刻拿来卖。</text></g></svg>