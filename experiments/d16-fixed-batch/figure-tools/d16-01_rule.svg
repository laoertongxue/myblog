<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1120" viewBox="0 0 700 1120"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="70.5" font-size="46" fill="rgb(0,0,0)">每天只检查一次</text><text x="32" y="133.0" font-size="32" fill="rgb(0,0,0)">教学模拟 · 日末固定批量规则</text><rect x="32" y="190" width="636" height="170" fill="none" stroke="black" stroke-width="2"/><text x="56" y="244.5" font-size="46" fill="rgb(0,0,0)">IP &gt; r</text><text x="56" y="322.5" font-size="36" fill="rgb(0,0,0)">不下单：订货量 0</text><rect x="32" y="400" width="636" height="170" fill="none" stroke="black" stroke-width="2"/><text x="56" y="454.5" font-size="46" fill="rgb(0,0,0)">IP = r</text><text x="56" y="532.5" font-size="36" fill="rgb(0,0,0)">触发：订货量 Q</text><rect x="32" y="610" width="636" height="170" fill="none" stroke="black" stroke-width="2"/><text x="56" y="664.5" font-size="46" fill="rgb(0,0,0)">IP &lt; r</text><text x="56" y="742.5" font-size="36" fill="rgb(0,0,0)">也只下单一批 Q</text><text x="32" y="861.0" font-size="33" fill="rgb(0,0,0)">r 是触发阈值，Q 是固定批量。</text><text x="32" y="926.0" font-size="32" fill="rgb(0,0,0)">不是补到 r，也不是补到目标 S。</text><polyline points="32,967 668,967" fill="none" stroke="black" stroke-width="3"/><text x="32" y="1038.5" font-size="36" fill="rgb(0,0,0)">每日复核，不是连续复核。</text></g></svg>