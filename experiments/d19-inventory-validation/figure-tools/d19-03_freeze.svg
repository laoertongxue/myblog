<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1530" viewBox="0 0 700 1530"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="44" font-weight="600">分块比较，冻结后再测试</text><rect x="32" y="130" width="636" height="180" fill="none" stroke="black" stroke-width="2"/><text x="56" y="194" font-size="46" font-weight="600">第 1—112 天</text><text x="56" y="264" font-size="38" font-weight="400">训练：建立模型与候选</text><path d="M350 326v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="386" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="450" font-size="44" font-weight="600">第 113—140 天</text><text x="56" y="522" font-size="40" font-weight="400">验证：比较候选策略</text><text x="56" y="579" font-size="38" font-weight="400">随后冻结规则与参数</text><path d="M350 632v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="692" width="636" height="310" fill="none" stroke="black" stroke-width="2"/><text x="56" y="758" font-size="40" font-weight="600">D20：第 141—180 天</text><text x="56" y="830" font-size="40" font-weight="400">预测测试范围</text><text x="56" y="906" font-size="39" font-weight="400">库存只评最后 28 天</text><text x="56" y="968" font-size="40" font-weight="400">即第 153—180 天</text><path d="M32 1068H668" stroke="black" stroke-width="2"/><text x="32" y="1140" font-size="42" font-weight="600">固定五日窗口不跨块</text><text x="32" y="1214" font-size="38" font-weight="400">136—140：在验证块内</text><text x="32" y="1286" font-size="38" font-weight="400">137—141：跨块，不纳入</text><rect x="32" y="1350" width="636" height="120" fill="none" stroke="black" stroke-width="2"/><text x="56" y="1427" font-size="44" font-weight="600">今天不读取测试数据</text></g></svg>
