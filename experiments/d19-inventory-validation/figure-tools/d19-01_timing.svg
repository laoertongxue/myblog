<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1510" viewBox="0 0 700 1510"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="44" font-weight="600">先对齐一天的事件顺序</text><rect x="32" y="128" width="636" height="180" fill="none" stroke="black" stroke-width="2"/><text x="56" y="186" font-size="40" font-weight="400">01  日初：到货入库</text><text x="56" y="258" font-size="38" font-weight="400">只收今天到期的订单</text><path d="M350 322v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="363" width="636" height="180" fill="none" stroke="black" stroke-width="2"/><text x="56" y="421" font-size="40" font-weight="400">02  日内：按需求履约</text><text x="56" y="493" font-size="38" font-weight="400">不足即失销，不留欠交</text><path d="M350 557v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="598" width="636" height="180" fill="none" stroke="black" stroke-width="2"/><text x="56" y="656" font-size="40" font-weight="400">03  日末：复核并下单</text><text x="56" y="728" font-size="38" font-weight="400">按策略判断是否补货</text><text x="32" y="857" font-size="42" font-weight="600">t 日末下单</text><text x="32" y="924" font-size="42" font-weight="400">t + L + 1 日初到货</text><rect x="32" y="974" width="636" height="120" fill="none" stroke="black" stroke-width="2"/><text x="56" y="1051" font-size="42" font-weight="400">L = 2 → t + 3 日初到</text><path d="M32 1153H668" stroke="black" stroke-width="2"/><text x="32" y="1223" font-size="39" font-weight="400">库存位置 IP = 现货 + 在途</text><text x="32" y="1305" font-size="39" font-weight="400">期末尚未到货的尾单</text><text x="32" y="1368" font-size="36" font-weight="400">保留在途，不删除、不提前收。</text><text x="32" y="1450" font-size="36" font-weight="400">教学模拟 · 无欠交模型</text></g></svg>
