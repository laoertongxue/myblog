<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1380" viewBox="0 0 700 1380"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="42" font-weight="600">公平比较，先固定共同输入</text><rect x="32" y="132" width="636" height="346" fill="none" stroke="black" stroke-width="2"/><text x="56" y="195" font-size="42" font-weight="400">同一条原始需求</text><text x="56" y="272" font-size="40" font-weight="400">同初始现货与在途</text><text x="56" y="349" font-size="40" font-weight="400">同外生原始需求预测</text><text x="56" y="425" font-size="38" font-weight="400">不拿策略销量替换需求</text><path d="M350 496v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="554" width="636" height="210" fill="none" stroke="black" stroke-width="2"/><text x="56" y="618" font-size="44" font-weight="600">(s, Q)  每天复核</text><text x="56" y="694" font-size="38" font-weight="400">达到触发条件，订固定 Q</text><rect x="32" y="814" width="636" height="210" fill="none" stroke="black" stroke-width="2"/><text x="56" y="878" font-size="42" font-weight="600">(R, S)  每 3 天复核</text><text x="56" y="954" font-size="38" font-weight="400">仅复核日决定是否补到 S</text><path d="M32 1090H668" stroke="black" stroke-width="2"/><text x="32" y="1162" font-size="40" font-weight="400">比较范围：开发验证回放</text><text x="32" y="1243" font-size="38" font-weight="400">可比较失销、库存与订货。</text><text x="32" y="1321" font-size="38" font-weight="400">模拟结果 ≠ 真实经营收益</text></g></svg>
