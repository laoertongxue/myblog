<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1510" viewBox="0 0 700 1510"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="43" font-weight="600">矩阵连接路网与配送</text><rect x="32" y="125" width="636" height="235" fill="none" stroke="black" stroke-width="2"/><text x="56" y="188" font-size="42" font-weight="600">路网：点与边</text><text x="56" y="261" font-size="38" font-weight="400">道路连接哪些位置？</text><text x="56" y="321" font-size="36" font-weight="400">每段成本是什么单位？</text><path d="M350 380v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="440" width="636" height="235" fill="none" stroke="black" stroke-width="2"/><text x="56" y="503" font-size="41" font-weight="600">矩阵：两点间成本</text><text x="56" y="576" font-size="38" font-weight="400">第 i 行、第 j 列</text><text x="56" y="636" font-size="36" font-weight="400">表示从 i 到 j 的成本</text><path d="M350 695v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="755" width="636" height="235" fill="none" stroke="black" stroke-width="2"/><text x="56" y="818" font-size="41" font-weight="600">路线：分车与排序</text><text x="56" y="891" font-size="34" font-weight="400">共同决定分配与访问顺序</text><text x="56" y="951" font-size="35" font-weight="400">逐段相加，包含最后回仓</text><path d="M32 1055H668" stroke="black" stroke-width="2"/><text x="32" y="1126" font-size="40" font-weight="600">经过某点 ≠ 已完成服务</text><text x="32" y="1200" font-size="35" font-weight="400">到达、卸货和签收需有约定。</text><text x="32" y="1290" font-size="35" font-weight="400">距离、时间、箱数分开记录。</text><text x="32" y="1380" font-size="35" font-weight="400">本篇矩阵为固定教学模拟。</text><text x="32" y="1460" font-size="34" font-weight="400">不调用真实地图，不实际派车。</text></g></svg>
