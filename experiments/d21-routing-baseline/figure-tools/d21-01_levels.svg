<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1430" viewBox="0 0 700 1430"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="44" font-weight="600">三类问题，三层决定</text><rect x="32" y="125" width="636" height="260" fill="none" stroke="black" stroke-width="2"/><text x="56" y="188" font-size="42" font-weight="600">01  两点最短路</text><text x="56" y="263" font-size="38" font-weight="400">A 到 B，沿哪条路走？</text><text x="56" y="333" font-size="36" font-weight="400">输入：路网与每段成本</text><path d="M350 405v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="465" width="636" height="260" fill="none" stroke="black" stroke-width="2"/><text x="56" y="528" font-size="42" font-weight="600">02  单车 TSP</text><text x="56" y="603" font-size="35" font-weight="400">一辆车，先后访问哪些点？</text><text x="56" y="673" font-size="36" font-weight="400">所有点访问后返回起点</text><path d="M350 745v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="805" width="636" height="260" fill="none" stroke="black" stroke-width="2"/><text x="56" y="868" font-size="42" font-weight="600">03  多车 VRP</text><text x="56" y="943" font-size="38" font-weight="400">哪个点分给哪辆车？</text><text x="56" y="1013" font-size="36" font-weight="400">还要决定各车访问顺序</text><path d="M32 1127H668" stroke="black" stroke-width="2"/><text x="32" y="1205" font-size="40" font-weight="600">容量、时间窗等约束</text><text x="32" y="1280" font-size="37" font-weight="400">需要另行建模与检查。</text><text x="32" y="1373" font-size="34" font-weight="400">会找最短路，不等于会排配送。</text></g></svg>
