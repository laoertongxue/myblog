<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1530" viewBox="0 0 700 1530"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="42" font-weight="600">可行基线，先过这四关</text><rect x="32" y="125" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="186" font-size="42" font-weight="600">01  服务覆盖</text><text x="56" y="260" font-size="35" font-weight="400">每个配送点恰好服务一次</text><text x="56" y="327" font-size="33" font-weight="400">不能漏点，也不能重复</text><rect x="32" y="415" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="476" font-size="42" font-weight="600">02  路线闭合</text><text x="56" y="550" font-size="35" font-weight="400">从仓出发，最终回到仓</text><text x="56" y="617" font-size="33" font-weight="400">距离要包括回仓这一段</text><rect x="32" y="705" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="766" font-size="42" font-weight="600">03  载荷合法</text><text x="56" y="840" font-size="35" font-weight="400">逐车核对箱数与容量</text><text x="56" y="907" font-size="33" font-weight="400">总容量够，不代表分车正确</text><rect x="32" y="995" width="636" height="245" fill="none" stroke="black" stroke-width="2"/><text x="56" y="1056" font-size="42" font-weight="600">04  比较公平</text><text x="56" y="1130" font-size="35" font-weight="400">使用相同数据、目标与约束</text><text x="56" y="1197" font-size="33" font-weight="400">不可行基线不能用于宣称降本</text><path d="M32 1298H668" stroke="black" stroke-width="2"/><text x="32" y="1375" font-size="42" font-weight="600">可行 ≠ 已证明最优</text><text x="32" y="1450" font-size="34" font-weight="400">教学结果不等于实际经营收益。</text></g></svg>
