<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1430" viewBox="0 0 700 1430"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="69.0" font-size="43" fill="rgb(0,0,0)">补的是库存位置缺口</text><text x="32" y="135.5" font-size="32" fill="rgb(0,0,0)">教学模拟 · 数量单位：公斤</text><rect x="32" y="181" width="636" height="172" fill="none" stroke="black" stroke-width="2"/><text x="56" y="238.0" font-size="34" fill="rgb(0,0,0)">仅复核日</text><text x="56" y="317.0" font-size="44" fill="rgb(0,0,0)">q = max(0, S − IP)</text><text x="32" y="432.5" font-size="41" fill="rgb(0,0,0)">IP = OH + OO − BO</text><text x="32" y="506.5" font-size="35" fill="rgb(0,0,0)">现货 + 有效在途 − 欠交</text><text x="32" y="573.5" font-size="35" fill="rgb(0,0,0)">主案例为失销：BO = 0</text><rect x="32" y="630" width="636" height="265" fill="none" stroke="black" stroke-width="2"/><text x="56" y="687.5" font-size="36" fill="rgb(0,0,0)">第 2 日末：S = 20，IP = 4</text><text x="56" y="764.5" font-size="36" fill="rgb(0,0,0)">下单 q = 16，IP 补到 20</text><text x="56" y="817.5" font-size="32" fill="rgb(0,0,0)">下单时不增现货</text><text x="56" y="863.5" font-size="32" fill="rgb(0,0,0)">第 5 日初到货后才可用</text><text x="32" y="958.5" font-size="36" fill="rgb(0,0,0)">若复核时 IP = 20 或 22</text><text x="32" y="1026.0" font-size="35" fill="rgb(0,0,0)">q 均为 0；不下负数订单。</text><polyline points="32,1075 668,1075" fill="none" stroke="black" stroke-width="3"/><text x="32" y="1155.0" font-size="37" fill="rgb(0,0,0)">欠交示意（非主案例）</text><text x="32" y="1224.5" font-size="40" fill="rgb(0,0,0)">IP = 5 + 8 − 3 = 10</text><text x="32" y="1299.5" font-size="33" fill="rgb(0,0,0)">若到复核日，S = 20 → q = 10</text><text x="32" y="1377.5" font-size="32" fill="rgb(0,0,0)">S 是目标，不是固定订货批量。</text></g></svg>