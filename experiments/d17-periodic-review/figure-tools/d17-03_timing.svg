<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1510" viewBox="0 0 700 1510"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="67.0" font-size="41" fill="rgb(0,0,0)">时点写清，保护期才清楚</text><text x="32" y="135.5" font-size="32" fill="rgb(0,0,0)">教学模拟 · R = 2，L = 2</text><rect x="32" y="180" width="636" height="200" fill="none" stroke="black" stroke-width="2"/><text x="56" y="237.5" font-size="32" fill="rgb(0,0,0)">每天：到货 → 需求 → 日末复核</text><text x="56" y="311.5" font-size="33" fill="rgb(0,0,0)">L 表示下单后完整等待日数</text><text x="56" y="364.5" font-size="32" fill="rgb(0,0,0)">非复核日跳过下单</text><rect x="32" y="438" width="636" height="135" fill="none" stroke="black" stroke-width="2"/><text x="56" y="490.5" font-size="38" fill="rgb(0,0,0)">第 2 日日末</text><text x="56" y="548.5" font-size="33" fill="rgb(0,0,0)">本次复核并下单</text><polyline points="350,582 350,606 341,597" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="618" width="636" height="135" fill="none" stroke="black" stroke-width="2"/><text x="56" y="670.5" font-size="38" fill="rgb(0,0,0)">第 4 日日末</text><text x="56" y="728.5" font-size="33" fill="rgb(0,0,0)">下次复核；q &gt; 0 才下单</text><polyline points="350,762 350,786 341,777" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="798" width="636" height="135" fill="none" stroke="black" stroke-width="2"/><text x="56" y="850.5" font-size="38" fill="rgb(0,0,0)">第 5 日日初</text><text x="56" y="908.5" font-size="33" fill="rgb(0,0,0)">第 2 日的订单到货</text><polyline points="350,942 350,966 341,957" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="978" width="636" height="135" fill="none" stroke="black" stroke-width="2"/><text x="56" y="1030.5" font-size="38" fill="rgb(0,0,0)">第 7 日日初</text><text x="56" y="1088.5" font-size="33" fill="rgb(0,0,0)">第 4 日若下单，此时到货</text><polyline points="32,1162 668,1162" fill="none" stroke="black" stroke-width="3"/><text x="32" y="1233.5" font-size="32" fill="rgb(0,0,0)">本次复核后，到下次订单可售前</text><text x="32" y="1303.5" font-size="37" fill="rgb(0,0,0)">第 3–6 日：共 R + L = 4 天</text><text x="32" y="1378.0" font-size="34" fill="rgb(0,0,0)">可作需求保护期的起点。</text><text x="32" y="1447.5" font-size="32" fill="rgb(0,0,0)">设定 S 仍须核对时点与缺货风险。</text></g></svg>