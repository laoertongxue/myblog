<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1090" viewBox="0 0 700 1090"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, Noto Sans SC" font-weight="400"><text x="32" y="69.0" font-size="43" fill="rgb(0,0,0)">先看日期，再算订货量</text><text x="32" y="135.5" font-size="32" fill="rgb(0,0,0)">教学模拟 · R = 2，首次第 2 日</text><rect x="32" y="193" width="636" height="155" fill="none" stroke="black" stroke-width="2"/><text x="56" y="249.0" font-size="40" fill="rgb(0,0,0)">第 2 日</text><text x="56" y="314.5" font-size="34" fill="rgb(0,0,0)">复核：按 S 与 IP 算量</text><rect x="32" y="380" width="636" height="155" fill="none" stroke="black" stroke-width="2"/><text x="56" y="436.0" font-size="40" fill="rgb(0,0,0)">第 3 日</text><text x="56" y="501.0" font-size="34" fill="rgb(0,0,0)">非复核：即使 IP = 0</text><rect x="32" y="567" width="636" height="155" fill="none" stroke="black" stroke-width="2"/><text x="56" y="623.0" font-size="40" fill="rgb(0,0,0)">第 4 日</text><text x="56" y="688.5" font-size="34" fill="rgb(0,0,0)">复核：再次计算订货量</text><text x="32" y="805.0" font-size="35" fill="rgb(0,0,0)">复核日：第 2、4、6……日末</text><polyline points="32,854 668,854" fill="none" stroke="black" stroke-width="3"/><text x="32" y="934.0" font-size="43" fill="rgb(0,0,0)">非复核日：q = 0</text><text x="32" y="1009.5" font-size="33" fill="rgb(0,0,0)">缺货不会自动打开订货窗口。</text></g></svg>