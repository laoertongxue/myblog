<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1410" viewBox="0 0 700 1410"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="42" font-weight="600">累计送出 ≠ 车上剩余</text><rect x="32" y="125" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="186" font-size="35" font-weight="600">出仓：装好本车全部货物</text><text x="56" y="260" font-size="40" font-weight="400">累计送出 0 箱</text><text x="56" y="324" font-size="40" font-weight="400">车上剩余 10 箱</text><path d="M350 375v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="435" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="496" font-size="35" font-weight="600">第一站：交付 2 箱之后</text><text x="56" y="570" font-size="40" font-weight="400">累计送出 2 箱</text><text x="56" y="634" font-size="40" font-weight="400">车上剩余 8 箱</text><path d="M350 685v32m-10-10 10 10 10-10" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="745" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="806" font-size="35" font-weight="600">最后一站：全部交付之后</text><text x="56" y="880" font-size="40" font-weight="400">累计送出 10 箱</text><text x="56" y="944" font-size="40" font-weight="400">车上剩余 0 箱</text><path d="M32 1040H668" stroke="black" stroke-width="2"/><text x="32" y="1115" font-size="34" font-weight="600">图中统一使用「服务后」时点。</text><text x="32" y="1190" font-size="34" font-weight="400">CumulVar 的到站值不能直接</text><text x="32" y="1255" font-size="34" font-weight="400">当作该站服务后的累计送出。</text><text x="32" y="1355" font-size="34" font-weight="400">仅限纯配送：不取货、不重装。</text></g></svg>
