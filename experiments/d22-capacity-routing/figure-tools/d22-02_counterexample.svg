<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1390" viewBox="0 0 700 1390"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="40" font-weight="600">总容量够，也可能装不下</text><rect x="32" y="125" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="188" font-size="38" font-weight="600">3 个配送点，每点 6 箱</text><text x="56" y="270" font-size="32" font-weight="400">总需求：6 + 6 + 6 = 18 箱</text><text x="56" y="326" font-size="34" font-weight="400">每个点不可拆分给多辆车</text><rect x="32" y="410" width="636" height="230" fill="none" stroke="black" stroke-width="2"/><text x="56" y="473" font-size="36" font-weight="600">2 辆车，每车容量 10 箱</text><text x="56" y="555" font-size="32" font-weight="400">总容量：10 + 10 = 20 箱</text><text x="56" y="611" font-size="32" font-weight="400">每车只跑一趟，途中不重装</text><rect x="32" y="695" width="636" height="260" fill="none" stroke="black" stroke-width="2"/><text x="56" y="758" font-size="36" font-weight="600">但一辆车不能接两个点</text><text x="56" y="840" font-size="34" font-weight="400">6 + 6 = 12 箱 > 10 箱</text><text x="56" y="913" font-size="35" font-weight="400">两辆车最多服务两个点</text><path d="M32 1020H668" stroke="black" stroke-width="2"/><text x="32" y="1090" font-size="40" font-weight="600">总需求 ≤ 总容量</text><text x="32" y="1155" font-size="36" font-weight="600">只是必要条件。</text><text x="32" y="1220" font-size="34" font-weight="400">必须能把每个点分配给车辆，</text><text x="32" y="1280" font-size="34" font-weight="400">并满足每辆车自己的容量。</text><text x="32" y="1340" font-size="30" font-weight="400">这个反例可用分配逻辑证明不可行。</text></g></svg>
