<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1530" viewBox="0 0 700 1530"><rect width="100%" height="100%" fill="white"/><g fill="black" font-family="Noto Sans SC, Noto Sans CJK SC, sans-serif"><text x="32" y="72" font-size="42" font-weight="600">先验可行，再比较距离</text><rect x="32" y="125" width="636" height="220" fill="none" stroke="black" stroke-width="2"/><text x="56" y="182" font-size="39" font-weight="600">01  服务覆盖</text><text x="56" y="253" font-size="34" font-weight="400">每点恰好服务一次</text><text x="56" y="315" font-size="32" font-weight="400">不可漏点、重复或拆单</text><rect x="32" y="390" width="636" height="220" fill="none" stroke="black" stroke-width="2"/><text x="56" y="447" font-size="39" font-weight="600">02  闭合路线</text><text x="56" y="518" font-size="34" font-weight="400">从仓出发，最终回仓</text><text x="56" y="580" font-size="32" font-weight="400">最后一段也要计入距离</text><rect x="32" y="655" width="636" height="220" fill="none" stroke="black" stroke-width="2"/><text x="56" y="712" font-size="39" font-weight="600">03  逐车容量</text><text x="56" y="783" font-size="34" font-weight="400">分别核对每辆车的箱数</text><text x="56" y="845" font-size="32" font-weight="400">总容量检查不能替代分车</text><rect x="32" y="920" width="636" height="220" fill="none" stroke="black" stroke-width="2"/><text x="56" y="977" font-size="39" font-weight="600">04  公平比较</text><text x="56" y="1048" font-size="34" font-weight="400">同一矩阵、需求与约束</text><text x="56" y="1110" font-size="32" font-weight="400">基线与新路线都必须可行</text><path d="M32 1200H668" stroke="black" stroke-width="2"/><text x="32" y="1280" font-size="40" font-weight="600">可行 ≠ 已证明最优</text><text x="32" y="1360" font-size="38" font-weight="600">超时无解 ≠ 已证不可行</text><text x="32" y="1460" font-size="32" font-weight="400">模拟里程差不等于实际经营收益。</text></g></svg>
