name: Deploy to 12lab.cn

on:
  push:
    branches: [main]
  # Hugo omits content whose date is still in the future, so a scheduled
  # rebuild is what actually publishes it. 16:10 UTC = 00:10 Asia/Shanghai
  # (hugo.toml timeZone), i.e. just after a post's publish date begins.
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  SERVER_HOST: 43.255.31.74
  SERVER_USER: root
  SITE_DIR: /var/www/12lab.cn

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.count.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Hugo Mod Tidy
        run: hugo mod tidy

      - name: Build
        run: hugo --minify --gc

      - name: Validate build
        id: count
        run: |
          if [ ! -d "public" ] || [ -z "$(ls -A public)" ]; then
            echo "Build output is empty!"
            exit 1
          fi
          PAGES=$(( $(find public -name "*.html" | wc -l) ))
          if [ "$PAGES" -lt 10 ]; then
            echo "::error::Build produced only $PAGES pages"
            exit 1
          fi
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "Build successful. Pages generated: $PAGES"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-site
          path: public/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      EXPECTED_PAGES: ${{ needs.build.outputs.pages }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-site
          path: public/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo -e "Host ${{ env.SERVER_HOST }}\n  HostName ${{ env.SERVER_HOST }}\n  User ${{ env.SERVER_USER }}\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Generate release ID
        id: release
        run: echo "id=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Upload to server
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "mkdir -p ${{ env.SITE_DIR }}/releases/${{ steps.release.outputs.id }}"
          rsync -avz --delete public/ ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SITE_DIR }}/releases/${{ steps.release.outputs.id }}/

      - name: Verify upload
        run: |
          UPLOADED=$(ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "find ${{ env.SITE_DIR }}/releases/${{ steps.release.outputs.id }} -name '*.html' | wc -l")
          UPLOADED=$(( UPLOADED ))
          EXPECTED=$(( EXPECTED_PAGES ))
          echo "Uploaded HTML files: $UPLOADED (expected $EXPECTED)"
          if [ "$UPLOADED" != "$EXPECTED" ]; then
            echo "::error::Uploaded $UPLOADED of $EXPECTED built pages - release not switched"
            exit 1
          fi

      - name: Switch current release
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "
            cd ${{ env.SITE_DIR }}
            if [ -d current ] && [ ! -L current ]; then rm -rf current; fi
            ln -sfn releases/${{ steps.release.outputs.id }} current.new
            mv -T current.new current
          "

      - name: Health check
        run: |
          sleep 2
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://12lab.cn/)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed! Rolling back..."
            # Single-quoted so the release lookup runs on the server, not on the runner.
            ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} '
              cd '"${{ env.SITE_DIR }}"'
              FAILED="${{ steps.release.outputs.id }}"
              PREVIOUS=$(ls -t releases/ | grep -v -x "$FAILED" | head -1)
              if [ -z "$PREVIOUS" ]; then
                echo "::error::No previous release available to roll back to"
                exit 1
              fi
              ln -sfn "releases/$PREVIOUS" current.new
              mv -T current.new current
              echo "Rolled back to release $PREVIOUS"
            '
            RECOVERED=$(curl -s -o /dev/null -w "%{http_code}" https://12lab.cn/)
            echo "Status after rollback: $RECOVERED"
            exit 1
          fi

      - name: Cleanup old releases
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "
            cd ${{ env.SITE_DIR }}/releases
            ls -t | tail -n +6 | xargs -r rm -rf
            echo 'Old releases cleaned. Remaining:'
            ls -t
          "

      - name: Deploy summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ steps.release.outputs.id }}" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://12lab.cn/" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Success" >> $GITHUB_STEP_SUMMARY
