name: Deploy to 12lab.cn

on:
  push:
    branches: [main]
  # Hugo omits content whose date is still in the future, so a scheduled
  # rebuild is what actually publishes it. 16:10 UTC = 00:10 Asia/Shanghai
  # (hugo.toml timeZone), i.e. just after a post's publish date begins.
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  SERVER_HOST: 43.255.31.74
  SERVER_USER: deploy12lab
  SITE_DIR: /var/www/12lab.cn

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages: ${{ steps.count.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'

      - name: Hugo Mod Tidy
        run: hugo mod tidy

      - name: Build
        run: OUT=public make check

      - name: Validate build
        id: count
        run: |
          if [ ! -d "public" ] || [ -z "$(ls -A public)" ]; then
            echo "Build output is empty!"
            exit 1
          fi
          PAGES=$(( $(find public -name "*.html" | wc -l) ))
          if [ "$PAGES" -lt 10 ]; then
            echo "::error::Build produced only $PAGES pages"
            exit 1
          fi
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "Build successful. Pages generated: $PAGES"

      - name: Generate release manifest
        run: python3 scripts/release-manifest.py public

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hugo-site
          path: public/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PAGES: ${{ needs.build.outputs.pages }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: hugo-site
          path: public/

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY_DEPLOY12LAB }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 scripts/deploy-known-hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ${{ env.SERVER_HOST }}
            HostName ${{ env.SERVER_HOST }}
            User ${{ env.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

      - name: Generate release ID
        id: release
        run: echo "id=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload to server
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SITE_DIR/releases/$RELEASE_ID'"
          rsync -avz --delete public/ "$SERVER_USER@$SERVER_HOST:$SITE_DIR/releases/$RELEASE_ID/"
          scp scripts/deploy-release.py "$SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/deploy-$RELEASE_ID.py"

      - name: Verify, switch and health check with rollback
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "python3 '/home/$SERVER_USER/deploy-$RELEASE_ID.py' --site-dir '$SITE_DIR' --release '$RELEASE_ID' --expected-pages '$EXPECTED_PAGES'"

      - name: Remove temporary credentials and runner script
        if: always()
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          if [ -n "$RELEASE_ID" ] && [ -f ~/.ssh/deploy_key ]; then
            ssh "$SERVER_USER@$SERVER_HOST" "rm -f '/home/$SERVER_USER/deploy-$RELEASE_ID.py'" || true
          fi
          rm -f ~/.ssh/deploy_key

      - name: Deploy summary
        run: |
          echo "## Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ steps.release.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://12lab.cn/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: All-file checksums and live resource probes passed" >> "$GITHUB_STEP_SUMMARY"
