name: D14 publication preflight
on:
  push:
    branches: [d14-review-20261107]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 0.166.0
          extended: true
      - name: Install browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium --only-shell
      - name: Full publication checks without deployment
        env:
          BROWSER_CHECKS: require
        run: make check
