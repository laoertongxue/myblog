baseURL = "https://12lab.cn/"
title = "拾贰画生 / 12Lab"
enableRobotsTXT = true
enableEmoji = true
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
locale = "zh-cn"
timeZone = "Asia/Shanghai"
timeout = "60s"
paginate = 12

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "index"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

enableInlineShortcodes = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[params]
  description = "有那么点儿追求的中年男人"
  [params.author]
    name = "拾贰画生"
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    displayCopyright = false
    displayPoweredBy = false
  [params.editURL]
    enable = false

[[menu.main]]
  name = "Weekly"
  pageRef = "/weekly"
  weight = 1

[[menu.main]]
  name = "专题"
  pageRef = "/topics"
  weight = 2

[[menu.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 3

[[menu.main]]
  name = "归档"
  pageRef = "/archive"
  weight = 4

[[menu.main]]
  name = "关于"
  pageRef = "/about"
  weight = 5

[[menu.main]]
  name = "搜索"
  weight = 6
  [menu.main.params]
    type = "search"

[taxonomies]
  tag = "tags"
  category = "categories"

[security]
  [security.http]
    urls = ["(?i)^https?://[a-z0-9]", "(?i)^https?://cdn\\.jsdelivr\\.net/"]

[permalinks]
  weekly = "/weekly/:filename/"
  blog = "/blog/:slug/"
