baseURL = "https://12lab.cn/"
title = "拾贰画生 · 有那么点儿追求的中年男人"
enableRobotsTXT = true
enableEmoji = true
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
locale = "zh-cn"
timeZone = "Asia/Shanghai"
timeout = "60s"
paginate = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "index"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[params]
  avatar = "images/avatar-wangye.png"
  description = "有那么点儿追求的中年男人"
  dateFormat = "2006 年 01 月 02 日"
  [params.author]
    name = "拾贰画生"
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    displayCopyright = false
    displayPoweredBy = false
  [params.editURL]
    enable = false

[[menu.main]]
  name = "首页"
  pageRef = "/"
  weight = 1
  [menu.main.params]
    icon = "home"
    placement = "leading"

[[menu.main]]
  name = "Weekly"
  pageRef = "/weekly"
  weight = 3
  [menu.main.params]
    placement = "leading"
    icon = "book"

[[menu.main]]
  name = "专题"
  pageRef = "/topics"
  weight = 4
  [menu.main.params]
    placement = "leading"
    icon = "folder"

[[menu.main]]
  name = "博客"
  pageRef = "/blog"
  weight = 5
  [menu.main.params]
    placement = "leading"
    icon = "book"

[[menu.main]]
  name = "关于"
  pageRef = "/about"
  weight = 5
  [menu.main.params]
    icon = "user"
    placement = "quick"

# Navigation is rendered by the site header and footer.
[[menu.main]]
  name = "搜索"
  pageRef = "/search"
  weight = 2
  [menu.main.params]
    placement = "leading"

[[menu.utility]]
  identifier = "archive"
  name = "归档"
  pageRef = "/archive"
  weight = 1

[[menu.utility]]
  name = "近况"
  pageRef = "/now"
  weight = 2
  [menu.utility.params]
    placement = "quick"

[[menu.utility]]
  name = "友链"
  pageRef = "/links"
  weight = 3
  [menu.utility.params]
    placement = "quick"

[[menu.utility]]
  identifier = "copyright"
  name = "版权与隐私"
  pageRef = "/copyright"
  weight = 4

[params.registration]
  icp = ""
  police = ""
  policeURL = ""

[taxonomies]
  tag = "tags"
  category = "categories"

# Remote data fetching (getJSON/getResource) is intentionally left at Hugo's
# default deny-all: no template or content in this site fetches remote resources.
[permalinks]
  weekly = "/weekly/:filename/"
  blog = "/blog/:slug/"

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75
  [imaging.exif]
    includeFields = "Orientation"

[privacy]
  [privacy.youtube]
    privacyEnhanced = true
  [privacy.twitter]
    enableDNT = true
