<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" role="img" aria-labelledby="title desc">
<title id="title">从一条直线到多特征预测</title>
<desc id="desc">原生900乘383像素出版封面。虚构禾味两店八SKU教学案例：已知输入、拟合规则、未来核验。预测净耗用不等于采购量。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="black" stroke-width="1.8"/></marker></defs>
<rect width="900" height="383" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="black" stroke-linecap="round" stroke-linejoin="round"><text x="36" y="56" font-size="35" font-weight="700">从一条直线到多特征预测</text><text x="36" y="90" font-size="17" font-weight="400">供应链预测与计划 03  /  禾味 2 店 × 8 SKU（虚构教学）</text><rect x="36" y="122" width="240" height="148" rx="8" fill="white" stroke="black" stroke-width="2"/><text x="54" y="160" font-size="28" font-weight="700">已知输入</text><text x="54" y="201" font-size="20" font-weight="400">预订、周末、促销</text><text x="54" y="236" font-size="20" font-weight="400">只用起点前信息</text><rect x="330" y="122" width="240" height="148" rx="8" fill="white" stroke="black" stroke-width="2"/><text x="348" y="160" font-size="28" font-weight="700">拟合规则</text><text x="348" y="201" font-size="20" font-weight="400">从直线到多个特征</text><text x="348" y="236" font-size="20" font-weight="400">用历史数据估系数</text><rect x="624" y="122" width="240" height="148" rx="8" fill="white" stroke="black" stroke-width="2"/><text x="642" y="160" font-size="28" font-weight="700">未来核验</text><text x="642" y="201" font-size="20" font-weight="400">按时间留出以后</text><text x="642" y="236" font-size="20" font-weight="400">比较预测与真实值</text><line x1="284" y1="196" x2="316" y2="196" stroke="black" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="578" y1="196" x2="610" y2="196" stroke="black" stroke-width="2.4" marker-end="url(#arrow)"/><text x="36" y="317" font-size="25" font-weight="700">预测净耗用 ≠ 采购量</text><text x="36" y="351" font-size="18" font-weight="400">全部为教学模拟；采购仍需结合库存、在途与订货约束另作决定。</text></g>
</svg>