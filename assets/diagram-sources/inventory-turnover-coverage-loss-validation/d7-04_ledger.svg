<svg xmlns="http://www.w3.org/2000/svg" width="800" height="472" viewBox="0 0 800 472"><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="800" height="472" rx="0" fill="#f5f3ed" stroke="none"/><text x="34" y="38" font-size="14" fill="#16786f" font-weight="bold">禾味一店大米 / 14天 / 固定成本10元每公斤</text><text x="34" y="80" font-size="28" fill="#183336" font-weight="bold">先让库存守恒，再解释三个结果</text><rect x="34" y="110" width="730" height="70" rx="14" fill="#e2ece5" stroke="none"/><text x="52" y="140" font-size="21" fill="#183336" font-weight="bold">期初100 + 入库140 − 耗用140 − 损耗4 = 期末96 公斤</text><text x="52" y="165" font-size="18" fill="#526767" font-weight="normal">同成本核对：1000 + 1400 − 1400 − 40 = 960 元</text><rect x="34" y="195" width="730" height="66" rx="14" fill="#ffffff" stroke="none"/><text x="49" y="223" font-size="19" fill="#16786f" font-weight="bold">历史周转</text><text x="164" y="221" font-size="18" fill="#183336" font-weight="normal">耗用1400元 ÷ 平均库存987.142857元</text><text x="164" y="247" font-size="17" fill="#526767" font-weight="normal">1.418234次 / 14天；周转天数9.871429</text><rect x="34" y="271" width="730" height="66" rx="14" fill="#ffffff" stroke="none"/><text x="49" y="299" font-size="19" fill="#16786f" font-weight="bold">未来覆盖</text><text x="164" y="297" font-size="18" fill="#183336" font-weight="normal">期末96公斤 − 预留6公斤 = 可用90公斤</text><text x="164" y="323" font-size="17" fill="#526767" font-weight="normal">未来7天日均20公斤；简化覆盖4.5天</text><rect x="34" y="347" width="730" height="66" rx="14" fill="#ffffff" stroke="none"/><text x="49" y="375" font-size="19" fill="#16786f" font-weight="bold">期间损耗</text><text x="164" y="373" font-size="18" fill="#183336" font-weight="normal">损耗40元 ÷（期初1000元 + 入库1400元）</text><text x="164" y="399" font-size="17" fill="#526767" font-weight="normal">本练习资源口径：1.6667%</text><text x="34" y="450" font-size="13" fill="#526767" font-weight="normal">D7 · 全部为教学模拟；口径与边界详见正文</text></g></svg>