<svg xmlns="http://www.w3.org/2000/svg" width="800" height="492" viewBox="0 0 800 492"><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="800" height="492" rx="0" fill="#f5f3ed" stroke="none"/><text x="34" y="38" font-size="14" fill="#16786f" font-weight="bold">禾味一店大米 / 可用量90公斤 / 不考虑未来到货</text><text x="34" y="80" font-size="28" fill="#183336" font-weight="bold">4.5天的均值答案，第4天就可能缺</text><text x="36" y="117" font-size="20" fill="#526767" font-weight="normal">未来7天需求：10、20、30、40、10、20、10 公斤</text><rect x="72" y="316.0" width="52" height="12.0" rx="4" fill="#16786f" stroke="none"/><text x="80" y="307.0" font-size="17" fill="#183336" font-weight="bold">10</text><text x="71" y="355" font-size="16" fill="#526767" font-weight="normal">第1天</text><rect x="168" y="292.0" width="52" height="36.0" rx="4" fill="#16786f" stroke="none"/><text x="176" y="283.0" font-size="17" fill="#183336" font-weight="bold">30</text><text x="167" y="355" font-size="16" fill="#526767" font-weight="normal">第2天</text><rect x="264" y="256.0" width="52" height="72.0" rx="4" fill="#16786f" stroke="none"/><text x="272" y="247.0" font-size="17" fill="#183336" font-weight="bold">60</text><text x="263" y="355" font-size="16" fill="#526767" font-weight="normal">第3天</text><rect x="360" y="208.0" width="52" height="120.0" rx="4" fill="#c88c66" stroke="none"/><text x="368" y="199.0" font-size="17" fill="#183336" font-weight="bold">100</text><text x="359" y="355" font-size="16" fill="#526767" font-weight="normal">第4天</text><rect x="456" y="196.0" width="52" height="132.0" rx="4" fill="#c88c66" stroke="none"/><text x="464" y="187.0" font-size="17" fill="#183336" font-weight="bold">110</text><text x="455" y="355" font-size="16" fill="#526767" font-weight="normal">第5天</text><rect x="552" y="172.0" width="52" height="156.0" rx="4" fill="#c88c66" stroke="none"/><text x="560" y="163.0" font-size="17" fill="#183336" font-weight="bold">130</text><text x="551" y="355" font-size="16" fill="#526767" font-weight="normal">第6天</text><rect x="648" y="160.0" width="52" height="168.0" rx="4" fill="#c88c66" stroke="none"/><text x="656" y="151.0" font-size="17" fill="#183336" font-weight="bold">140</text><text x="647" y="355" font-size="16" fill="#526767" font-weight="normal">第7天</text><path d="M40 220.0 H764" stroke="#b24d38" stroke-width="2" stroke-dasharray="6 4"/><rect x="40" y="192.0" width="112" height="25" rx="0" fill="#f5f3ed" stroke="none"/><text x="43" y="212.0" font-size="16" fill="#b24d38" font-weight="bold">可用量 90</text><text x="34" y="390" font-size="18" fill="#526767" font-weight="normal">柱形为累计需求（公斤），第4天累计100，超出可用10。</text><rect x="34" y="408" width="730" height="46" rx="14" fill="#e2ece5" stroke="none"/><text x="50" y="438" font-size="19" fill="#183336" font-weight="bold">均值：90 ÷ 20 = 4.5天    |    路径：完整覆盖3天，第4天缺10公斤</text><text x="34" y="470" font-size="13" fill="#526767" font-weight="normal">D7 · 全部为教学模拟；口径与边界详见正文</text></g></svg>