<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="800" height="470" rx="0" fill="#f5f3ed" stroke="none"/><text x="34" y="38" font-size="14" fill="#16786f" font-weight="bold">验收路径 / 不把“能运行”当作“算对了”</text><text x="34" y="80" font-size="28" fill="#183336" font-weight="bold">先用反例守住履约，再扩展库存指标</text><rect x="34" y="110" width="234" height="98" rx="14" fill="#ffffff" stroke="none"/><text x="49" y="142" font-size="18" fill="#16786f" font-weight="bold">准时足量 → 通过</text><text x="49" y="178" font-size="18" fill="#526767" font-weight="normal">10 / 10</text><rect x="282" y="110" width="234" height="98" rx="14" fill="#ffffff" stroke="none"/><text x="297" y="142" font-size="18" fill="#183336" font-weight="bold">准时部分 → 失败</text><text x="297" y="178" font-size="18" fill="#526767" font-weight="normal">7 / 10</text><rect x="530" y="110" width="234" height="98" rx="14" fill="#ffffff" stroke="none"/><text x="545" y="142" font-size="18" fill="#183336" font-weight="bold">迟到补齐 → 失败</text><text x="545" y="178" font-size="18" fill="#526767" font-weight="normal">及时仍为 7 / 10</text><rect x="34" y="222" width="234" height="98" rx="14" fill="#ffffff" stroke="none"/><text x="49" y="254" font-size="18" fill="#16786f" font-weight="bold">分批按时 → 通过</text><text x="49" y="290" font-size="18" fill="#526767" font-weight="normal">4 + 6 = 10</text><rect x="282" y="222" width="234" height="98" rx="14" fill="#ffffff" stroke="none"/><text x="297" y="254" font-size="18" fill="#183336" font-weight="bold">整单取消 → 排除</text><text x="297" y="290" font-size="18" fill="#526767" font-weight="normal">不进入分母</text><rect x="530" y="222" width="234" height="98" rx="14" fill="#ffffff" stroke="none"/><text x="545" y="254" font-size="18" fill="#183336" font-weight="bold">未到期 → 排除</text><text x="545" y="290" font-size="18" fill="#526767" font-weight="normal">尚不能定案</text><rect x="34" y="348" width="730" height="68" rx="14" fill="#e2ece5" stroke="none"/><text x="52" y="375" font-size="20" fill="#183336" font-weight="bold">有效4单：OTIF 2/4 = 50%  ·  数量满足率 34/40 = 85%</text><text x="52" y="402" font-size="18" fill="#526767" font-weight="normal">验收通过后，再核查耗用、成本、可用状态和损耗事件。</text><text x="34" y="448" font-size="13" fill="#526767" font-weight="normal">D7 · 全部为教学模拟；口径与边界详见正文</text></g></svg>