<svg xmlns="http://www.w3.org/2000/svg" width="800" height="472" viewBox="0 0 800 472"><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="800" height="472" rx="0" fill="#f5f3ed" stroke="none"/><text x="34" y="38" font-size="14" fill="#16786f" font-weight="bold">匿名服装情景 / 所有数量均为模拟</text><text x="34" y="80" font-size="28" fill="#183336" font-weight="bold">同一场生产协同，三个不同追问</text><rect x="34" y="110" width="730" height="96" rx="14" fill="#ffffff" stroke="none"/><rect x="46" y="125" width="64" height="31" rx="7" fill="#e2ece5" stroke="none"/><text x="58" y="148" font-size="18" fill="#16786f" font-weight="bold">过去</text><text x="126" y="139" font-size="21" fill="#183336" font-weight="bold">甲面料：周转 0.8 次 / 14天</text><text x="126" y="166" font-size="17" fill="#526767" font-weight="normal">耗用 800米 × 20元；平均库存 1000米 × 20元</text><text x="126" y="190" font-size="17" fill="#526767" font-weight="normal">追问：排产、批量与库存结构是否匹配？</text><rect x="34" y="215" width="730" height="96" rx="14" fill="#ffffff" stroke="none"/><rect x="46" y="230" width="64" height="31" rx="7" fill="#e2ece5" stroke="none"/><text x="58" y="253" font-size="18" fill="#16786f" font-weight="bold">未来</text><text x="126" y="244" font-size="21" fill="#183336" font-weight="bold">乙面料：完整覆盖 2 天</text><text x="126" y="271" font-size="17" fill="#526767" font-weight="normal">现存300 − 预留80 − 待检20 = 可用200米</text><text x="126" y="295" font-size="17" fill="#526767" font-weight="normal">三天需求80、120、100米；第三天出现缺口。</text><rect x="34" y="320" width="730" height="96" rx="14" fill="#ffffff" stroke="none"/><rect x="46" y="335" width="64" height="31" rx="7" fill="#e2ece5" stroke="none"/><text x="58" y="358" font-size="18" fill="#16786f" font-weight="bold">损失</text><text x="126" y="349" font-size="21" fill="#183336" font-weight="bold">甲面料：资源损耗约 0.91%</text><text x="126" y="376" font-size="17" fill="#526767" font-weight="normal">报损20米 ÷（期初1200 + 入库1000）米</text><text x="126" y="400" font-size="17" fill="#526767" font-weight="normal">追问：哪些事件被计作损耗，原因是什么？</text><text x="34" y="450" font-size="13" fill="#526767" font-weight="normal">D7 · 全部为教学模拟；口径与边界详见正文</text></g></svg>