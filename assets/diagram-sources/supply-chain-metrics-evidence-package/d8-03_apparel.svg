<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="100%" height="100%" fill="#f4f4f4"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="47" font-size="26" fill="#202020" font-weight="bold">服装协同 三个数字对应三个不同追问</text><text x="34" y="80" font-size="16" fill="#202020" font-weight="normal">匿名模拟 · 主账本与可用库存情景分开，不相互冒充</text><rect x="34" y="108" width="932" height="110" rx="8" fill="#ffffff"/><text x="54" y="147" font-size="22" fill="#202020" font-weight="bold">同一物料账本，单位：米</text><text x="54" y="192" font-size="24" fill="#202020" font-weight="normal">期初 100 ＋ 合格入库 40 － 领用 70 － 报损 2 ＝ 期末 68</text><rect x="34" y="240" width="458" height="130" rx="8" fill="#ffffff"/><text x="54" y="278" font-size="23" fill="#202020" font-weight="bold">历史周转</text><text x="54" y="317" font-size="22" fill="#202020" font-weight="normal">70 ÷ (991 / 14) ≈ 0.9889 次</text><text x="54" y="350" font-size="18" fill="#202020" font-weight="normal">14天期间；周转天数≈14.16天</text><rect x="508" y="240" width="458" height="130" rx="8" fill="#ffffff"/><text x="528" y="278" font-size="23" fill="#202020" font-weight="bold">期间损耗</text><text x="528" y="317" font-size="22" fill="#202020" font-weight="normal">2 ÷ (100 + 40) ≈ 1.43%</text><text x="528" y="350" font-size="18" fill="#202020" font-weight="normal">固定单价20元/米；成本口径同值</text><rect x="34" y="392" width="932" height="165" rx="8" fill="#e5e5e5"/><text x="54" y="430" font-size="22" fill="#202020" font-weight="bold">独立的关键色库存状态：100 − 20预留 − 10待检 = 70米可用</text><text x="54" y="475" font-size="22" fill="#202020" font-weight="normal">第1天 需求 30</text><text x="54" y="514" font-size="19" fill="#202020" font-weight="normal">期末可用 40</text><text x="354" y="475" font-size="22" fill="#202020" font-weight="normal">第2天 需求 40</text><text x="354" y="514" font-size="19" fill="#202020" font-weight="normal">期末可用 0</text><text x="654" y="475" font-size="22" fill="#202020" font-weight="normal">第3天 需求 50</text><text x="654" y="514" font-size="19" fill="#202020" font-weight="normal">缺口 50，不能完整覆盖</text><text x="34" y="595" font-size="17" fill="#202020" font-weight="normal">日末快照合计991米；完整覆盖2天，不等于历史周转天数，也不是预测结果。</text></g></svg>