<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="100%" height="100%" fill="#f4f4f4"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="47" font-size="26" fill="#202020" font-weight="bold">先补数据，再决定使用什么算法</text><text x="34" y="80" font-size="16" fill="#202020" font-weight="normal">D8只列下一步问题与验收，没有宣称完成预测、补货或配送优化</text><rect x="34" y="110" width="932" height="112" rx="8" fill="#ffffff"/><text x="54" y="152" font-size="27" fill="#202020" font-weight="bold">预测</text><text x="188" y="149" font-size="23" fill="#202020" font-weight="normal">问题：未来需要多少</text><text x="188" y="190" font-size="19" fill="#202020" font-weight="normal">补：需求历史、日期、缺货标记</text><text x="600" y="190" font-size="18" fill="#202020" font-weight="normal">验收：时间切分与未来扰动</text><rect x="34" y="237" width="932" height="112" rx="8" fill="#ffffff"/><text x="54" y="279" font-size="27" fill="#202020" font-weight="bold">补货</text><text x="188" y="276" font-size="23" fill="#202020" font-weight="normal">问题：何时订、订多少</text><text x="188" y="317" font-size="19" fill="#202020" font-weight="normal">补：在途、提前期、事件顺序</text><text x="600" y="317" font-size="18" fill="#202020" font-weight="normal">验收：同路需求与库存守恒</text><rect x="34" y="364" width="932" height="112" rx="8" fill="#ffffff"/><text x="54" y="406" font-size="27" fill="#202020" font-weight="bold">配送</text><text x="188" y="403" font-size="23" fill="#202020" font-weight="normal">问题：哪辆车、什么顺序</text><text x="188" y="444" font-size="19" fill="#202020" font-weight="normal">补：容量、时间窗、成本矩阵</text><text x="600" y="444" font-size="18" fill="#202020" font-weight="normal">验收：先查可行，再比成本</text><text x="34" y="532" font-size="17" fill="#202020" font-weight="normal">订货量不等于真实需求；配送将用独立10点2车案例，不强行对应禾味2店。</text></g></svg>