<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><rect width="100%" height="100%" fill="#f4f4f4"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="47" font-size="26" fill="#202020" font-weight="bold">六张卡，两种数据完备程度</text><text x="34" y="80" font-size="16" fill="#202020" font-weight="normal">前三项由六表与规则计算；后三项需要额外证据</text><rect x="34" y="110" width="308" height="190" rx="8" fill="#ffffff"/><text x="52" y="150" font-size="23" fill="#202020" font-weight="bold">订单 OTIF</text><text x="52" y="195" font-size="19" fill="#202020" font-weight="normal">全部商品行按时足量</text><text x="52" y="247" font-size="17" fill="#202020" font-weight="normal">订单 / 订单行 / 合格验收</text><rect x="356" y="110" width="308" height="190" rx="8" fill="#ffffff"/><text x="374" y="150" font-size="23" fill="#202020" font-weight="bold">数量满足率</text><text x="374" y="195" font-size="19" fill="#202020" font-weight="normal">逐行封顶，按 SKU 汇总</text><text x="374" y="247" font-size="17" fill="#202020" font-weight="normal">订单 / 订单行 / 合格验收</text><rect x="678" y="110" width="308" height="190" rx="8" fill="#ffffff"/><text x="696" y="150" font-size="23" fill="#202020" font-weight="bold">时点缺货率</text><text x="696" y="195" font-size="19" fill="#202020" font-weight="normal">零库存快照 / 有效快照</text><text x="696" y="247" font-size="17" fill="#202020" font-weight="normal">店 × SKU × 固定日末</text><rect x="34" y="320" width="308" height="190" rx="8" fill="#e5e5e5"/><text x="52" y="360" font-size="23" fill="#202020" font-weight="bold">期间周转</text><text x="52" y="405" font-size="19" fill="#202020" font-weight="normal">耗用成本 / 平均库存成本</text><text x="52" y="457" font-size="17" fill="#202020" font-weight="normal">补耗用、成本、完整快照</text><rect x="356" y="320" width="308" height="190" rx="8" fill="#e5e5e5"/><text x="374" y="360" font-size="23" fill="#202020" font-weight="bold">未来覆盖</text><text x="374" y="405" font-size="19" fill="#202020" font-weight="normal">可用量满足连续需求日</text><text x="374" y="457" font-size="17" fill="#202020" font-weight="normal">补状态、预留、未来需求</text><rect x="678" y="320" width="308" height="190" rx="8" fill="#e5e5e5"/><text x="696" y="360" font-size="23" fill="#202020" font-weight="bold">期间损耗</text><text x="696" y="405" font-size="19" fill="#202020" font-weight="normal">损耗成本 / 资源成本基数</text><text x="696" y="457" font-size="17" fill="#202020" font-weight="normal">补报损、成本、期初与入库</text><text x="34" y="548" font-size="17" fill="#202020" font-weight="normal">缺失不能当零；不同版本、单位、时间与资源基数不能直接合并。</text></g></svg>