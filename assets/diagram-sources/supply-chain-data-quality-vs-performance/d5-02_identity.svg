<svg xmlns="http://www.w3.org/2000/svg" width="720" height="950" viewBox="0 0 720 950">
<title>重复上报与合法分批验收的区别</title>
<rect width="720" height="950" fill="white"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="55" font-size="33" font-weight="700" fill="#222" text-anchor="start">先看身份，再决定是否重复</text>
<text x="32" y="99" font-size="24" font-weight="400" fill="#555" text-anchor="start">模拟：一条需求与两次验收，是不同粒度</text>
<rect x="32" y="135" width="656" height="310" rx="12" fill="#f7f7f7" stroke="#888" stroke-width="1.5"/>
<text x="54" y="179" font-size="31" font-weight="700" fill="#222" text-anchor="start">订单行重复上报</text>
<text x="54" y="226" font-size="28" font-weight="400" fill="#222" text-anchor="start">FE1 → L1  计划 100 件</text>
<text x="54" y="270" font-size="28" font-weight="400" fill="#222" text-anchor="start">FE1 → L1  计划 100 件</text>
<text x="54" y="323" font-size="26" font-weight="500" fill="#222" text-anchor="start">同事件、字段一致，确认重复传输</text>
<text x="54" y="375" font-size="30" font-weight="600" fill="#222" text-anchor="start">只计一条需求：100 件</text>
<text x="54" y="416" font-size="25" font-weight="400" fill="#555" text-anchor="start">原始两行保留，折叠依据另记。</text>
<rect x="32" y="485" width="656" height="310" rx="12" fill="#f7f7f7" stroke="#888" stroke-width="1.5"/>
<text x="54" y="529" font-size="31" font-weight="700" fill="#222" text-anchor="start">合法分批验收</text>
<text x="54" y="576" font-size="28" font-weight="400" fill="#222" text-anchor="start">RE1 → L1  按时验收 60 件</text>
<text x="54" y="620" font-size="28" font-weight="400" fill="#222" text-anchor="start">RE2 → L1  按时验收 40 件</text>
<text x="54" y="673" font-size="26" font-weight="500" fill="#222" text-anchor="start">事件身份不同，均应保留</text>
<text x="54" y="725" font-size="30" font-weight="600" fill="#222" text-anchor="start">验收合计：60 + 40 = 100 件</text>
<text x="54" y="766" font-size="25" font-weight="400" fill="#555" text-anchor="start">不能把第二批当成重复记录删掉。</text>
<text x="32" y="858" font-size="30" font-weight="600" fill="#222" text-anchor="start">重复需求不等于分批验收</text>
<text x="32" y="905" font-size="25" font-weight="400" fill="#555" text-anchor="start">身份冲突或字段不一致时，先阻断并核对。</text>
</g></svg>
