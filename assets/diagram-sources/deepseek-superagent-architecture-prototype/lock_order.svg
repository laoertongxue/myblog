<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker></defs><rect width="1600" height="1110" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="70" y="85" font-size="46" font-weight="700" text-anchor="start">交叉等待如何被固定锁序打断</text><text x="70" y="137" font-size="26" font-weight="400" text-anchor="start">Python 内存账户教学示例 · 单进程、单事件循环、所有写入遵循同一协议</text><path d="M70 168H1530" stroke="#111" stroke-width="2"/><rect x="70" y="205" width="690" height="530" rx="14" fill="#fff" stroke="#111" stroke-width="2"/><text x="95" y="252" font-size="29" font-weight="700" text-anchor="start">反例：跟随转账方向加锁</text><rect x="110" y="300" width="270" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="135" y="347" font-size="29" font-weight="700" text-anchor="start">请求 A → B</text><text x="135" y="394" font-size="26" font-weight="400" text-anchor="start">先持有锁 A</text><rect x="450" y="300" width="270" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="475" y="347" font-size="29" font-weight="700" text-anchor="start">请求 B → A</text><text x="475" y="394" font-size="26" font-weight="400" text-anchor="start">先持有锁 B</text><polyline points="245,410 245,495 585,495 585,410" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="475" font-size="26" font-weight="400" text-anchor="start">等待锁 B</text><polyline points="585,410 585,575 245,575 245,410" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="320" y="620" font-size="26" font-weight="400" text-anchor="start">等待锁 A</text><text x="110" y="690" font-size="25" font-weight="400" text-anchor="start">双方持有对方需要的锁，形成循环等待</text><rect x="840" y="205" width="690" height="530" rx="14" fill="#fff" stroke="#111" stroke-width="2"/><text x="865" y="252" font-size="29" font-weight="700" text-anchor="start">修复：所有请求遵循同一锁序</text><rect x="885" y="300" width="600" height="90" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="910" y="347" font-size="29" font-weight="700" text-anchor="start">A → B 与 B → A：均按标识排序</text><rect x="885" y="440" width="250" height="100" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="910" y="487" font-size="29" font-weight="700" text-anchor="start">先获取锁 A</text><rect x="1235" y="440" width="250" height="100" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="1260" y="487" font-size="29" font-weight="700" text-anchor="start">再获取锁 B</text><polyline points="1185,390 1010,390 1010,440" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1135,490 1235,490" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="885" y="595" font-size="26" font-weight="400" text-anchor="start">双锁内检查余额，再更新余额</text><text x="885" y="638" font-size="26" font-weight="400" text-anchor="start">未拿到第一把锁的请求先等待</text><text x="885" y="681" font-size="26" font-weight="400" text-anchor="start">持有者释放后，再由下一请求继续</text><rect x="70" y="785" width="1460" height="140" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="95" y="832" font-size="29" font-weight="700" text-anchor="start">加锁前先做入参校验</text><text x="95" y="879" font-size="26" font-weight="400" text-anchor="start">金额为正整数（不含 bool）　｜　账户必须存在　｜　拒绝同账户转账</text><rect x="70" y="960" width="1460" height="108" fill="#f4f4f4" rx="10"/><text x="92" y="1000" font-size="25" font-weight="400" text-anchor="start">固定锁序消除此示例中的循环等待，不代表任意业务代码都不会死锁。</text><text x="92" y="1039" font-size="25" font-weight="400" text-anchor="start">余额检查在双锁内进行；生产系统还需要事务、幂等、鉴权与跨进程并发控制。</text></g></svg>