<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker></defs><rect width="1600" height="1180" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="70" y="85" font-size="46" font-weight="700" text-anchor="start">新任务候选的授权路径（简化）</text><text x="70" y="137" font-size="26" font-weight="400" text-anchor="start">显式请求与推断候选分开处理；主动模式不是权限开关</text><path d="M70 168H1530" stroke="#111" stroke-width="2"/><rect x="420" y="200" width="760" height="85" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="445" y="247" font-size="29" font-weight="700" text-anchor="start">事件 → 来源策略与身份检查</text><polyline points="600,285 600,325 370,325 370,365" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1000,285 1000,325 1155,325 1155,365" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="365" width="600" height="105" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="95" y="412" font-size="29" font-weight="700" text-anchor="start">显式请求 explicit</text><text x="95" y="459" font-size="26" font-weight="400" text-anchor="start">不意味着“@ 即获授权”</text><rect x="770" y="365" width="760" height="105" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="795" y="412" font-size="29" font-weight="700" text-anchor="start">推断候选 inferred</text><text x="795" y="459" font-size="26" font-weight="400" text-anchor="start">由主动模式决定是否进入接单路径</text><polyline points="370,470 370,520" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="520" width="600" height="165" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="95" y="567" font-size="29" font-weight="700" text-anchor="start">Router 路由决策</text><text x="95" y="614" font-size="26" font-weight="400" text-anchor="start">接受 / 关联 / 忽略 / 停止（按请求）</text><text x="95" y="656" font-size="26" font-weight="400" text-anchor="start">explicit 在 off / observe / auto 均可处理</text><polyline points="885.0,470 885.0,520" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="770" y="520" width="230" height="215" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="795" y="567" font-size="30" font-weight="700" text-anchor="start">off</text><text x="795" y="614" font-size="26" font-weight="400" text-anchor="start">不接纳候选</text><polyline points="1145.0,470 1145.0,520" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1030" y="520" width="230" height="215" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="1055" y="567" font-size="30" font-weight="700" text-anchor="start">observe</text><text x="1055" y="614" font-size="26" font-weight="400" text-anchor="start">评估并记录</text><text x="1055" y="656" font-size="26" font-weight="400" text-anchor="start">不接单</text><polyline points="1410.0,470 1410.0,520" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1290" y="520" width="240" height="215" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="1315" y="567" font-size="30" font-weight="700" text-anchor="start">auto</text><text x="1315" y="614" font-size="26" font-weight="400" text-anchor="start">评估通过</text><text x="1315" y="656" font-size="26" font-weight="400" text-anchor="start">且匹配启用规则</text><text x="1315" y="698" font-size="26" font-weight="400" text-anchor="start">才接单</text><polyline points="370,685 370,835 800,835 800,885" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1410,735 1410,835 800,835" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="480" y="885" width="640" height="85" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="505" y="932" font-size="29" font-weight="700" text-anchor="start">获准任务 → Mandate 限定范围</text><rect x="70" y="1015" width="1460" height="108" fill="#f4f4f4" rx="10"/><text x="92" y="1055" font-size="25" font-weight="400" text-anchor="start">允许名单与授权范围由宿主管理；聊天内容不能自行扩大权限。</text><text x="92" y="1094" font-size="25" font-weight="400" text-anchor="start">此图仅说明新任务候选；已有任务的后续消息另循订阅规则。</text></g></svg>