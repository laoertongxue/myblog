<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker></defs><rect width="1600" height="1050" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="70" y="85" font-size="46" font-weight="700" text-anchor="start">重启恢复：接续任务，不是保活进程</text><text x="70" y="137" font-size="26" font-weight="400" text-anchor="start">持久状态与执行过程分开看；恢复后先核对实际副作用</text><path d="M70 168H1530" stroke="#111" stroke-width="2"/><rect x="70" y="220" width="440" height="390" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="95" y="267" font-size="29" font-weight="700" text-anchor="start">重启前</text><text x="95" y="314" font-size="26" font-weight="400" text-anchor="start">会话、目录与订阅</text><text x="95" y="356" font-size="26" font-weight="400" text-anchor="start">待处理消息、已存储工作</text><text x="95" y="398" font-size="26" font-weight="400" text-anchor="start">以及正在运行的后台工作</text><rect x="580" y="220" width="440" height="390" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="605" y="267" font-size="29" font-weight="700" text-anchor="start">宿主重启</text><text x="605" y="314" font-size="26" font-weight="400" text-anchor="start">保留已持久化的记录</text><text x="605" y="356" font-size="26" font-weight="400" text-anchor="start">运行中的后台工作结束</text><text x="605" y="398" font-size="26" font-weight="400" text-anchor="start">不能当作进程快照迁移</text><rect x="1090" y="220" width="440" height="390" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="1115" y="267" font-size="29" font-weight="700" text-anchor="start">恢复之后</text><text x="1115" y="314" font-size="26" font-weight="400" text-anchor="start">中断任务创建新 Assignment</text><text x="1115" y="356" font-size="26" font-weight="400" text-anchor="start">附带恢复说明重新开始</text><text x="1115" y="398" font-size="26" font-weight="400" text-anchor="start">重新检查现场，再继续</text><polyline points="510,410 580,410" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1020,410 1090,410" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="670" width="1460" height="150" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="95" y="717" font-size="29" font-weight="700" text-anchor="start">继续执行之前：先核对证据</text><text x="95" y="764" font-size="26" font-weight="400" text-anchor="start">工作目录与未提交修改　→　Git 历史　→　远端状态　→　避免重复外部操作</text><rect x="70" y="865" width="1460" height="108" fill="#f4f4f4" rx="10"/><text x="92" y="905" font-size="25" font-weight="400" text-anchor="start">边界一：没有固定秒数或无损恢复保证；已发送的消息与远端操作不会自动撤销。</text><text x="92" y="944" font-size="25" font-weight="400" text-anchor="start">边界二：独立工作目录不是安全沙盒；额外隔离须由部署者配置并验证。</text></g></svg>