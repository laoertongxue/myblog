<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/></marker></defs><rect width="1600" height="1000" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#111"><text x="70" y="85" font-size="46" font-weight="700" text-anchor="start">从逐个会话跟进，到统一入口协调</text><text x="70" y="137" font-size="26" font-weight="400" text-anchor="start">交互组织方式对照 · 设计解读，不是对所有单会话工具的断言</text><path d="M70 168H1530" stroke="#111" stroke-width="2"/><rect x="70" y="205" width="690" height="600" rx="14" fill="#fff" stroke="#111" stroke-width="2"/><text x="95" y="252" font-size="29" font-weight="700" text-anchor="start">缺乏异步与持久化时</text><rect x="115" y="290" width="600" height="95" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="140" y="337" font-size="29" font-weight="700" text-anchor="start">工程师：逐个查看进度</text><rect x="115" y="485" width="180" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="140" y="532" font-size="28" font-weight="700" text-anchor="start">会话 A</text><polyline points="205,385 205,485" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="485" width="180" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="350" y="532" font-size="28" font-weight="700" text-anchor="start">会话 B</text><polyline points="415,385 415,485" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="485" width="180" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="560" y="532" font-size="28" font-weight="700" text-anchor="start">会话 C</text><polyline points="625,385 625,485" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="115" y="670" font-size="28" font-weight="400" text-anchor="start">人来搬运上下文、决定下一步</text><text x="115" y="725" font-size="28" font-weight="400" text-anchor="start">长任务等待与会话切换叠加</text><rect x="840" y="205" width="690" height="600" rx="14" fill="#fff" stroke="#111" stroke-width="2"/><text x="865" y="252" font-size="29" font-weight="700" text-anchor="start">Router–Worker 分层协作</text><rect x="885" y="290" width="600" height="95" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="910" y="337" font-size="29" font-weight="700" text-anchor="start">工程师 ↔ Router：统一交互入口</text><rect x="885" y="485" width="180" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="910" y="532" font-size="25" font-weight="700" text-anchor="start">Worker A</text><polyline points="975,385 975,485" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1025,485 1025,420 1025,385" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="1095" y="485" width="180" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="1120" y="532" font-size="25" font-weight="700" text-anchor="start">Worker B</text><polyline points="1185,385 1185,485" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1235,485 1235,420 1235,385" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="1305" y="485" width="180" height="110" rx="14" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="1330" y="532" font-size="25" font-weight="700" text-anchor="start">Worker C</text><polyline points="1395,385 1395,485" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1445,485 1445,420 1445,385" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="885" y="670" font-size="28" font-weight="400" text-anchor="start">各任务拥有独立会话与工作目录</text><text x="885" y="725" font-size="28" font-weight="400" text-anchor="start">后台执行，汇总需要人决策的事项</text><rect x="70" y="845" width="1460" height="108" fill="#f4f4f4" rx="10"/><text x="92" y="885" font-size="25" font-weight="400" text-anchor="start">实线：任务分派　　虚线：结果与问题回传</text><text x="92" y="924" font-size="25" font-weight="400" text-anchor="start">连续性来自状态与路由设计；独立目录不等于安全沙盒，能力仍取决于部署。</text></g></svg>