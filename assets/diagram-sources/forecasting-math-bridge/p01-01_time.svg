<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="650" fill="#fff"/><text x="40" y="57" font-size="35" font-weight="650" fill="#111">先标清：站在哪天，预测哪天</text><text x="40" y="99" font-size="22" font-weight="400" fill="#555">模拟日期：11 月 6 日发出对 11 月 11 日的预测</text><path d="M40 122 L860 122" fill="none" stroke="#333" stroke-width="3" /><rect x="40" y="154" width="820" height="106" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="66" y="198" font-size="38" font-weight="650" fill="#111">ŷ(T + 5 | T)</text><text x="349" y="193" font-size="25" font-weight="500" fill="#111">帽子：预测值</text><text x="349" y="232" font-size="25" font-weight="500" fill="#111">右侧 T：预测发起时点</text><path d="M88 327 L800 327" fill="none" stroke="#333" stroke-width="3" /><path d="M720 327 L800 327" fill="none" stroke="#333" stroke-width="3" /><path d="M790 320 L800 327 L790 334" fill="none" stroke="#333" stroke-width="3"/><circle cx="270" cy="327" r="8" fill="#111"/><circle cx="719" cy="327" r="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="160" y="301" font-size="25" font-weight="600" fill="#111">11 月 6 日日终</text><text x="639" y="301" font-size="25" font-weight="600" fill="#111">11 月 11 日</text><text x="220" y="369" font-size="25" font-weight="600" fill="#111">起点 T</text><text x="658" y="369" font-size="25" font-weight="600" fill="#111">目标 T+5</text><rect x="40" y="418" width="397" height="128" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="64" y="457" font-size="22" font-weight="600" fill="#111">可用：截止起点已获得的信息</text><text x="64" y="496" font-size="22" font-weight="400" fill="#111">历史需求、已确认的活动计划</text><rect x="463" y="418" width="397" height="128" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="487" y="457" font-size="22" font-weight="600" fill="#111">不可用：目标日的实际结果</text><text x="487" y="496" font-size="22" font-weight="400" fill="#111">11 月 11 日实际天气、销量</text><text x="40" y="599" font-size="23" font-weight="400" fill="#111">y₃ 是第 3 天实际值；不是 y × 3。预测与实际要用相同单位。</text></svg>
