<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="850" fill="#fff"/><text x="40" y="57" font-size="35" font-weight="650" fill="#111">标准差与预测误差，围绕的中心不同</text><text x="40" y="99" font-size="22" font-weight="400" fill="#555">禾味 A 店 · SKU01 鸡腿肉｜三天日需求量，单位 kg</text><path d="M40 122 L860 122" fill="none" stroke="#333" stroke-width="3" /><rect x="40" y="151" width="820" height="215" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="64" y="192" font-size="25" font-weight="600" fill="#111">日期</text><text x="295" y="192" font-size="25" font-weight="600" fill="#111">第 1 天</text><text x="488" y="192" font-size="25" font-weight="600" fill="#111">第 2 天</text><text x="680" y="192" font-size="25" font-weight="600" fill="#111">第 3 天</text><text x="64" y="238" font-size="25" font-weight="400" fill="#111">实际 y</text><text x="320" y="238" font-size="27" font-weight="400" fill="#111">10</text><text x="514" y="238" font-size="27" font-weight="400" fill="#111">12</text><text x="706" y="238" font-size="27" font-weight="400" fill="#111">14</text><text x="64" y="284" font-size="25" font-weight="400" fill="#111">预测 ŷ</text><text x="320" y="284" font-size="27" font-weight="400" fill="#111">11</text><text x="514" y="284" font-size="27" font-weight="400" fill="#111">11</text><text x="706" y="284" font-size="27" font-weight="400" fill="#111">13</text><text x="64" y="330" font-size="25" font-weight="400" fill="#111">误差 y − ŷ</text><text x="320" y="330" font-size="27" font-weight="400" fill="#111">−1</text><text x="514" y="330" font-size="27" font-weight="400" fill="#111">+1</text><text x="706" y="330" font-size="27" font-weight="400" fill="#111">+1</text><rect x="40" y="392" width="397" height="256" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="64" y="435" font-size="25" font-weight="600" fill="#111">标准差：实际围绕均值</text><text x="64" y="483" font-size="22" font-weight="400" fill="#111">均值 = (10+12+14)÷3 = 12</text><text x="64" y="526" font-size="24" font-weight="400" fill="#111">偏离均值：−2、0、+2</text><text x="64" y="568" font-size="22" font-weight="400" fill="#111">总体方差 = (4+0+4)÷3</text><text x="64" y="610" font-size="24" font-weight="600" fill="#111">总体标准差 ≈ 1.633 kg</text><rect x="463" y="392" width="397" height="256" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="487" y="435" font-size="25" font-weight="600" fill="#111">误差：实际减各自预测</text><text x="487" y="483" font-size="24" font-weight="400" fill="#111">绝对误差：1、1、1</text><text x="487" y="526" font-size="24" font-weight="400" fill="#111">平方误差：1、1、1</text><text x="487" y="568" font-size="24" font-weight="400" fill="#111">MAE = 3÷3 = 1 kg</text><text x="487" y="610" font-size="24" font-weight="600" fill="#111">RMSE = √(3÷3) = 1 kg</text><text x="40" y="702" font-size="24" font-weight="400" fill="#111">这里视作完整总体；样本方差除以 n−1，标准差再开方。</text><text x="40" y="747" font-size="23" font-weight="400" fill="#111">同一组实际值可以配不同预测，误差会变，实际的标准差不变。</text><text x="40" y="799" font-size="22" font-weight="400" fill="#555">全部为教学模拟；本图没有训练或比较预测模型。</text></svg>
