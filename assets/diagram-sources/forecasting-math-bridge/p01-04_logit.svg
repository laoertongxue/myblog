<svg xmlns="http://www.w3.org/2000/svg" width="900" height="815" viewBox="0 0 900 815" font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="815" fill="#fff"/><text x="40" y="57" font-size="35" font-weight="650" fill="#111">把概率变成分数，再把分数还原为概率</text><text x="40" y="99" font-size="22" font-weight="400" fill="#555">p 是概率；z 是无单位分数。这里只演示函数，不训练模型。</text><path d="M40 122 L860 122" fill="none" stroke="#333" stroke-width="3" /><text x="40" y="175" font-size="31" font-weight="600" fill="#111">正向：z = logit(p) = ln[p ÷ (1−p)]</text><rect x="40" y="211" width="194" height="78" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="62" y="259" font-size="28" font-weight="600" fill="#111">p = 0.5</text><path d="M245 250 L282 250" fill="none" stroke="#333" stroke-width="3" /><path d="M272 243 L282 250 L272 257" fill="none" stroke="#333" stroke-width="3"/><rect x="296" y="211" width="260" height="78" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="317" y="259" font-size="27" font-weight="400" fill="#111">0.5÷0.5 = 1</text><path d="M567 250 L604 250" fill="none" stroke="#333" stroke-width="3" /><path d="M594 243 L604 250 L594 257" fill="none" stroke="#333" stroke-width="3"/><rect x="618" y="211" width="242" height="78" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="636" y="259" font-size="25" font-weight="600" fill="#111">ln(1) = 0</text><rect x="40" y="317" width="194" height="78" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="62" y="365" font-size="28" font-weight="600" fill="#111">p = 0.8</text><path d="M245 356 L282 356" fill="none" stroke="#333" stroke-width="3" /><path d="M272 349 L282 356 L272 363" fill="none" stroke="#333" stroke-width="3"/><rect x="296" y="317" width="260" height="78" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="317" y="365" font-size="27" font-weight="400" fill="#111">0.8÷0.2 = 4</text><path d="M567 356 L604 356" fill="none" stroke="#333" stroke-width="3" /><path d="M594 349 L604 356 L594 363" fill="none" stroke="#333" stroke-width="3"/><rect x="618" y="317" width="242" height="78" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="636" y="365" font-size="25" font-weight="600" fill="#111">ln(4) ≈ 1.386</text><text x="40" y="450" font-size="31" font-weight="600" fill="#111">反向：p = 1 ÷ [1 + exp(−z)]</text><rect x="40" y="484" width="820" height="149" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="64" y="531" font-size="26" font-weight="400" fill="#111">z = 0     →  exp(0) = 1       →  p = 1÷2 = 0.5</text><text x="64" y="579" font-size="26" font-weight="400" fill="#111">z = ln4  →  exp(−ln4) = ¼  →  p = 1÷1.25 = 0.8</text><text x="40" y="684" font-size="24" font-weight="400" fill="#111">ln 是以 e 为底的对数；exp(−z) 就是 e 的 −z 次幂。</text><text x="40" y="729" font-size="23" font-weight="400" fill="#111">正向必须 0 &lt; p &lt; 1；p 为 0 或 1 时不能直接代入有限公式。</text><text x="40" y="774" font-size="23" font-weight="400" fill="#111">概率 0.8 = 80%，赔率为 4；赔率 4 不等于概率 400%。</text></svg>
