<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="820" fill="#fff"/><text x="40" y="57" font-size="35" font-weight="650" fill="#111">取消概率：先看清这一次的分母</text><text x="40" y="99" font-size="22" font-weight="400" fill="#555">匿名服装 · S01-M 模拟订单批次｜每单一件，取消为整单取消</text><path d="M40 122 L860 122" fill="none" stroke="#333" stroke-width="3" /><rect x="40" y="164" width="210" height="109" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="68" y="210" font-size="34" font-weight="650" fill="#111">100 单</text><text x="68" y="247" font-size="22" font-weight="400" fill="#111">第 1 天开始</text><rect x="345" y="164" width="210" height="109" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="373" y="210" font-size="34" font-weight="650" fill="#111">90 单</text><text x="373" y="247" font-size="22" font-weight="400" fill="#111">第 2 天开始</text><rect x="650" y="164" width="210" height="109" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="678" y="210" font-size="34" font-weight="650" fill="#111">81 单</text><text x="678" y="247" font-size="22" font-weight="400" fill="#111">第 2 天结束</text><path d="M261 217 L332 217" fill="none" stroke="#333" stroke-width="3" /><path d="M322 210 L332 217 L322 224" fill="none" stroke="#333" stroke-width="3"/><path d="M566 217 L637 217" fill="none" stroke="#333" stroke-width="3" /><path d="M627 210 L637 217 L627 224" fill="none" stroke="#333" stroke-width="3"/><text x="65" y="320" font-size="25" font-weight="600" fill="#111">取消 10 单</text><text x="365" y="320" font-size="25" font-weight="600" fill="#111">取消 9 单</text><text x="664" y="320" font-size="25" font-weight="600" fill="#111">观测留存</text><rect x="40" y="355" width="820" height="118" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="64" y="397" font-size="25" font-weight="600" fill="#111">第 1 天：10÷100 = 10%     第 2 天：9÷90 = 10%</text><text x="64" y="443" font-size="23" font-weight="400" fill="#111">9÷100 = 9% 是初始批次占比，不是第 2 天的条件取消率。</text><rect x="40" y="505" width="820" height="206" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="64" y="549" font-size="27" font-weight="600" fill="#111">假设新批次也适用这两个条件概率</text><text x="64" y="595" font-size="26" font-weight="400" fill="#111">两天留存概率 = (1−0.1) × (1−0.1) = 0.81</text><text x="64" y="641" font-size="27" font-weight="600" fill="#111">新 30 单的期望留存 = 30 × 0.81 = 24.3 单</text><text x="64" y="684" font-size="23" font-weight="400" fill="#111">期望是重复批次的平均；单次实际留存只能是整数。</text><text x="40" y="766" font-size="23" font-weight="400" fill="#111">第二个 90% 已以第一天留存为条件；这一步不要求两天独立。</text></svg>
