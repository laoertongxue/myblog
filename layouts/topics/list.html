{{ define "main" }}
<div class="hx:mx-auto hx:flex hx:max-w-screen-xl hx:px-4 hx:sm:px-6 hx:lg:px-8">
  <div class="hx:w-full">
    <h1 class="hx:text-3xl hx:font-bold hx:text-gray-900 hx:dark:text-gray-100">专题</h1>
    <p class="hx:mt-2 hx:text-gray-500 hx:dark:text-gray-400">{{ .Description }}</p>

    <div class="hx:mt-8 hx:grid hx:gap-6 hx:sm:grid-cols-2 hx:lg:grid-cols-3">
      {{ range .Sections }}
      <a href="{{ .RelPermalink }}" class="hx:group hx:block hx:rounded-lg hx:border hx:border-gray-200 hx:p-6 hx:hover:border-gray-400 hx:dark:border-gray-700 hx:dark:hover:border-gray-500 hx:transition-colors">
        <h2 class="hx:text-lg hx:font-semibold hx:text-gray-900 hx:group-hover:text-gray-600 hx:dark:text-gray-100 hx:dark:group-hover:text-gray-300">{{ .Title }}</h2>
        <p class="hx:mt-2 hx:text-sm hx:text-gray-500 hx:dark:text-gray-400">{{ .Description }}</p>
        <div class="hx:mt-3 hx:text-xs hx:text-gray-400 hx:dark:text-gray-500">
          {{ len .RegularPages }} 章
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
