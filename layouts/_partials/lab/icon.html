{{- /* Inline SVG glyphs. Only the three names the templates actually ask for are
     kept (menu -> mobile toggle, search -> search form, toc -> floating TOC) so
     this file cannot drift into a second, unrendered icon set. Anything else
     falls back to the document glyph. */ -}}
<svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ if eq . "menu" }}<path d="M4 6h16M4 12h16M4 18h16"/>{{ else if eq . "search" }}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>{{ else if eq . "toc" }}<path d="M9 6h11M9 12h11M9 18h11M4 6h.1M4 12h.1M4 18h.1"/>{{ else }}<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/>{{ end }}</svg>
