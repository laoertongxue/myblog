{{- $sources := slice -}}
{{- with .Params.cover }}{{ $sources = slice . }}{{ else }}
  {{- with .Params.images }}{{ $sources = first 1 . }}{{ else }}
    {{- range first 1 ($.Resources.ByType "image") }}{{ $sources = $sources | append .Name }}{{ end -}}
  {{- end -}}
{{- end -}}
{{- return $sources -}}
