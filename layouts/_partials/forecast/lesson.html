<article id="lesson" class="reading-page" tabindex="-1">
  <div class="prose"><div class="lesson-content">{{ .RawContent | safeHTML }}</div></div>
  <div class="check course-completion"><label><input id="complete" type="checkbox">我已完成练习，并逐条对照验收</label><p>仅保存在本机当前浏览器，无账号云同步；清除浏览器数据会丢失。不自动认定你通过测试。建议先保留输出文件和计算过程。</p></div>
  <nav class="bottomnav article-pager" aria-label="上下课"><div class="article-prev">{{ with .NextInSection }}<a href="{{ .RelPermalink }}"><span>← 上一课</span><strong>{{ .Title }}</strong></a>{{ end }}</div><div class="article-next">{{ with .PrevInSection }}<a href="{{ .RelPermalink }}"><span>下一课 →</span><strong>{{ .Title }}</strong></a>{{ end }}</div></nav>
</article>
