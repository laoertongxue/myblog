<div class="lessonbar"><a href="/forecast/">← 学习路线</a><span>{{ range where hugo.Data.forecast.course "id" $.Params.unit }}{{ .kicker }}{{ end }}</span><button id="print" type="button">打印本课</button></div>
<h1>{{ .Title }}</h1>
<div class="lesson-content">{{ .RawContent | safeHTML }}</div>

<div class="bottomnav"><div>{{ with .NextInSection }}<a href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}</div><div>{{ with .PrevInSection }}<a href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}</div></div>
